<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA ADMIN PANEL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Poppins;padding:15px;margin:0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header-actions{display:flex;gap:8px;align-items:center}
.logout-btn{background:#ef4444;color:white;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px}
.notif-btn{background:#1a1a1a;border:1px solid #333;color:#fbbf24;border:none;padding:8px 10px;border-radius:8px;font-size:18px;cursor:pointer;position:relative}
.notif-badge{position:absolute;top:-5px;right:-5px;background:#ef4444;color:white;border-radius:50%;font-size:10px;font-weight:700;padding:2px 6px;min-width:18px;text-align:center}
.box{background:#111;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:15px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}
.stat-card{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:12px;text-align:center}
.stat-card h4{color:#888;font-size:11px;margin:0}
.stat-card p{font-size:16px;font-weight:700;margin:5px 0 0 0}
.search-box{display:flex;align-items:center;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:10px;margin-bottom:15px}
.search-box input{flex:1;background:transparent;border:none;color:white;font-size:14px;outline:none;font-family:Poppins}
h2{color:#fbbf24;text-align:center;margin:0}
h3{color:#fbbf24;margin:0 0 12px 0;font-size:15px}
.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:2px;font-size:11px;font-family:Poppins;position:relative}
.btn-blue{background:#3b82f6;color:white}
.btn-orange{background:#f59e0b;color:#000}
.btn-red{background:#ef4444;color:white}
.btn-green{background:#22c55e;color:#000}
.btn-purple{background:#8b5cf6;color:white}
.btn-msg-notif{background:#ef4444!important; color:white!important}
.user-card{background:#1a1a1a;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #333;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.user-num{background:#fbbf24;color:#000;font-weight:700;font-size:11px;border-radius:6px;padding:4px 8px;min-width:28px;text-align:center;margin-top:3px}
.user-info{font-size:12px;line-height:1.8;flex:1}
.btn-group{display:flex;flex-direction:column;gap:5px;min-width:90px}
.req-card{background:#1a1a1a;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #333;font-size:12px}
#loginScreen{display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;justify-content:center;align-items:center}
.login-box{background:#111;padding:25px;border-radius:16px;border:1px solid #333;width:90%;max-width:350px;text-align:center}
input, textarea{padding:10px;background:#222;border:1px solid #444;color:white;border-radius:8px;width:100%;margin-bottom:10px;font-family:Poppins}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;justify-content:center;align-items:center}
.modal-content{background:#111;width:90%;max-width:450px;border-radius:16px;padding:20px;border:1px solid #333;max-height:90vh;overflow-y:auto}
.msg-badge{position:absolute;top:-5px;right:-5px;background:#fbbf24;color:#000;border-radius:50%;font-size:9px;font-weight:700;padding:2px 5px;min-width:16px;text-align:center}
.message-card{background:#1a1a1a;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #333;border-left:4px solid #8b5cf6}
</style>
</head>
<body>

<!-- ADMIN LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h2>👑 NEXA ADMIN LOGIN</h2>
    <input type="password" id="adminPassword" placeholder="Enter Admin Password">
    <button class="btn btn-blue" style="width:100%;padding:12px" onclick="checkLogin()">Login</button>
    <p id="loginError" style="color:#ef4444;font-size:12px;margin-top:10px"></p>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="mainPanel" style="display:none">
  <div class="header">
    <h2>👑 NEXA ADMIN PANEL</h2>
    <div class="header-actions">
      <button class="notif-btn" onclick="openMessagesModal()">🔔<span id="notifBadge" class="notif-badge" style="display:none">0</span></button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><h4>Total Invested</h4><p id="totalInvested" style="color:#22c55e">+Ksh 0.00</p></div>
    <div class="stat-card"><h4>Today's Invested</h4><p id="todayInvested" style="color:#22c55e">+Ksh 0.00</p></div>
    <div class="stat-card"><h4>Today's Withdrawals</h4><p id="todayWithdrawals" style="color:#ef4444">-Ksh 0.00</p></div>
    <div class="stat-card"><h4>Total Withdrawals</h4><p id="totalWithdrawals" style="color:#ef4444">-Ksh 0.00</p></div>
  </div>

  <div class="box"><h3>💸 Pending Withdrawals</h3><div id="withdrawList">Loading...</div></div>
  <div class="box"><h3>🎁 Pending Referral Bonus</h3><div id="referralList">Loading...</div></div>

  <div class="box">
    <h3>👥 All Users</h3>
    <div class="search-box"><input type="text" id="searchInput" placeholder="Search by Phone or User ID..."></div>
    <div id="userList">Loading...</div>
  </div>

  <!-- ALL MESSAGES MODAL -->
  <div id="messagesModal" class="modal" onclick="closeMessagesModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>📩 All Messages</h3>
      <div id="messagesList">Loading...</div>
      <button class="btn btn-red" style="width:100%;margin-top:10px" onclick="closeMessagesModal()">Close</button>
    </div>
  </div>

  <!-- SEND MESSAGE MODAL -->
  <div id="messageModal" class="modal" onclick="closeMessageModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>📩 Send Message</h3>
      <p id="messageUserPhone" style="color:#fbbf24;margin-bottom:10px"></p>
      <textarea id="userMessageInput" placeholder="Type message..." rows="4"></textarea>
      <div style="display:flex;gap:8px">
        <button class="btn btn-purple" style="flex:1" onclick="sendUserMessage()">Send</button>
        <button class="btn btn-red" style="flex:1" onclick="closeMessageModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ADMIN_PASSWORD = "admin123";
let allUsers = []; let userCounter = 1; let selectedUserPhone = "";
let unreadCounts = {}; let totalUnread = 0;

function checkLogin(){
  let pass=document.getElementById('adminPassword').value;
  if(pass===ADMIN_PASSWORD){
    localStorage.setItem('nexaAdminLoggedIn','true');
    showPanel();
  }else{
    document.getElementById('loginError').innerText="❌ Wrong Password. Use: admin123";
  }
}
function showPanel(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainPanel').style.display='block';
  loadMessages(); loadUsers(); loadWithdrawals(); loadReferralRequests(); loadStats();
}
function logout(){localStorage.removeItem('nexaAdminLoggedIn');location.reload();}

// LOAD ALL MESSAGES + COUNT FOR BELL + PER USER
function loadMessages(){
  db.collection("userMessages").orderBy("date","desc").limit(50).onSnapshot(s=>{
    let h=""; totalUnread=0; unreadCounts={};
    s.forEach(d=>{
      let x=d.data();
      if(!x.read){
        totalUnread++;
        unreadCounts[x.phone] = (unreadCounts[x.phone] || 0) + 1;
      }
      h+=`<div class="message-card"><b style="color:#8b5cf6">${x.phone}</b><br>${x.message}<br><small style="color:#666">${x.date?x.date.toDate().toLocaleString():""}</small></div>`;
    });
    document.getElementById('messagesList').innerHTML=h||"No messages";
    
    // UPDATE TOP BELL
    if(totalUnread>0){
      document.getElementById('notifBadge').style.display='block';
      document.getElementById('notifBadge').innerText=totalUnread;
    } else {
      document.getElementById('notifBadge').style.display='none';
    }
    
    renderUsers(allUsers); // update buttons too
  });
}

function openMessagesModal(){document.getElementById('messagesModal').style.display='flex';}
function closeMessagesModal(){document.getElementById('messagesModal').style.display='none';}

function loadStats(){
  let today = new Date(); today.setHours(0,0,0,0);
  let totalInvested = 0; let todayInvested = 0; let totalWithdrawals = 0; let todayWithdrawals = 0;
  
  db.collection("users").get().then(s=>{
    s.forEach(d=>{let u = d.data();totalInvested += u.totalInvested || 0;
      if(u.lastPurchaseDate && u.lastPurchaseDate.toDate() >= today){todayInvested += u.lastPurchaseAmount || 0;}
    });
    document.getElementById('totalInvested').innerText = `+Ksh ${totalInvested.toFixed(2)}`;
    document.getElementById('todayInvested').innerText = `+Ksh ${todayInvested.toFixed(2)}`;
  });

  Promise.all([
    db.collection("withdrawals").where("status","==","paid").get(),
    db.collection("referralRequests").where("status","==","paid").get()
  ]).then(([wSnap, rSnap])=>{
    wSnap.forEach(d=>{let w = d.data(); totalWithdrawals += w.amount || 0; if(w.date && w.date.toDate() >= today){ todayWithdrawals += w.amount || 0; }});
    rSnap.forEach(d=>{let r = d.data(); totalWithdrawals += r.amount || 0; if(r.date && r.date.toDate() >= today){ todayWithdrawals += r.amount || 0; }});
    document.getElementById('totalWithdrawals').innerText = `-Ksh ${totalWithdrawals.toFixed(2)}`;
    document.getElementById('todayWithdrawals').innerText = `-Ksh ${todayWithdrawals.toFixed(2)}`;
  });
}

function loadUsers(){
  db.collection("users").get().then(s=>{
    allUsers=[];
    s.forEach(d=>{let u=d.data();u.docId=d.id;allUsers.push(u)});
    renderUsers(allUsers);
  })
}

function renderUsers(users){
  let h=""; userCounter=1;
  users.forEach(u=>{
    let products = u.productsPurchased || 0;
    let invested = u.totalInvested || 0;
    let totalIncome = (u.totalWithdrawn || 0) + (u.totalReferralEarned || 0);
    let todayIncome = (u.todayIncome || 0) + (u.todayReferralIncome || 0);
    let referrals = u.referralCount || 0;
    let refIncome = u.totalReferralEarned || 0;
    let balance = u.balance || 0;
    let msgCount = unreadCounts[u.phone] || 0;

    let btnClass = msgCount > 0? "btn btn-msg-notif" : "btn btn-purple";
    let badge = msgCount > 0? `<span class="msg-badge">${msgCount}</span>` : "";

    h+=`
    <div class="user-card">
      <div class="user-num">#${userCounter}</div>
      <div class="user-info">
        <b style="color:#fbbf24">${u.phone}</b><br>
        ID: ${u.userID || 'NO ID'} | Ref: ${u.refCode || 'NO CODE'}<br>
        💰 Balance: <b style="color:#22c55e">Ksh ${balance.toFixed(2)}</b><br>
        📦 Products: <b style="color:#fbbf24">${products}</b><br>
        💵 Invested: <b style="color:#3b82f6">Ksh ${invested.toFixed(2)}</b><br>
        📈 Total Income: <b style="color:#22c55e">Ksh ${totalIncome.toFixed(2)}</b><br>
        🔥 Today: <b style="color:#f59e0b">Ksh ${todayIncome.toFixed(2)}</b><br>
        👥 Referrals: <b style="color:#8b5cf6">${referrals}</b><br>
        🎁 Ref Income: <b style="color:#8b5cf6">Ksh ${refIncome.toFixed(2)}</b>
      </div>
      <div class="btn-group">
        <button class="${btnClass}" onclick="openMessageModal('${u.phone}')">📩 Msg ${msgCount > 0? msgCount : ''}${badge}</button>
        <button class="btn btn-blue" onclick="deposit('${u.phone}')">Deposit</button>
        <button class="btn btn-orange" onclick="resetUser('${u.phone}')">Reset</button>
        <button class="btn btn-red" onclick="deleteUser('${u.phone}')">Delete</button>
      </div>
    </div>`;
    userCounter++;
  });
  document.getElementById('userList').innerHTML=h;
}

document.getElementById('searchInput').addEventListener('keyup', function(){
  let q=this.value.toLowerCase();
  let f=allUsers.filter(u=> (u.phone && u.phone.toLowerCase().includes(q)) || (u.userID && u.userID.toLowerCase().includes(q)));
  renderUsers(f);
});

function openMessageModal(phone){
  selectedUserPhone = phone;
  document.getElementById('messageUserPhone').innerText = "To: " + phone;
  document.getElementById('messageModal').style.display='flex';
  
  // MARK MESSAGES AS READ WHEN OPENED
  db.collection("userMessages").where("phone","==",phone).where("read","==",false).get().then(s=>{
    s.forEach(d=>{ db.collection("userMessages").doc(d.id).update({read:true}) })
  })
}
function closeMessageModal(){document.getElementById('messageModal').style.display='none';}
function sendUserMessage(){
  let msg=document.getElementById('userMessageInput').value;
  if(!msg)return;
  db.collection("userMessages").add({
    phone:selectedUserPhone,
    message:msg,
    date:firebase.firestore.FieldValue.serverTimestamp(),
    read:false
  }).then(()=>{alert("✅ Message Sent");closeMessageModal();document.getElementById('userMessageInput').value="";})
}

function deposit(phone){let a=prompt("Amount to add:");if(a)db.collection("users").doc(phone).update({balance:firebase.firestore.FieldValue.increment(parseFloat(a))}).then(()=>loadUsers());}
function resetUser(phone){if(confirm("Reset this user?"))db.collection("users").doc(phone).update({balance:0,productsPurchased:0,totalInvested:0,totalWithdrawn:0,todayIncome:0,referralCount:0,totalReferralEarned:0,todayReferralIncome:0}).then(()=>loadUsers());}
function deleteUser(phone){if(confirm("Delete this user?"))db.collection("users").doc(phone).delete().then(()=>loadUsers());}

function loadWithdrawals(){db.collection("withdrawals").where("status","==","pending").get().then(s=>{let h="";if(s.empty)h="<p style='color:#888'>No pending</p>";s.forEach(d=>{let x=d.data();h+=`<div class="req-card"><b>User:</b> ${x.phone}<br><b>Amount:</b> Ksh ${x.amount}<br><button class="btn btn-green" onclick="approveWithdraw('${d.id}')">Approve</button><button class="btn-red" onclick="rejectWithdraw('${d.id}')">Reject</button></div>`;});document.getElementById('withdrawList').innerHTML=h;})}
function loadReferralRequests(){db.collection("referralRequests").where("status","==","pending").get().then(s=>{let h="";if(s.empty)h="<p style='color:#888'>No pending</p>";s.forEach(d=>{let x=d.data();h+=`<div class="req-card"><b>User:</b> ${x.phone}<br><b>Bonus:</b> Ksh ${x.amount}<br><button class="btn btn-green" onclick="approveReferral('${d.id}')">Approve</button><button class="btn-red" onclick="rejectReferral('${d.id}')">Reject</button></div>`;});document.getElementById('referralList').innerHTML=h;})}
function approveWithdraw(id){db.collection("withdrawals").doc(id).update({status:"paid",date:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{loadWithdrawals();loadStats();});}
function rejectWithdraw(id){db.collection("withdrawals").doc(id).update({status:"rejected"}).then(()=>loadWithdrawals());}
function approveReferral(id){db.collection("referralRequests").doc(id).get().then(d=>{let x=d.data();db.collection("users").doc(x.phone).update({balance:firebase.firestore.FieldValue.increment(x.amount)});db.collection("referralRequests").doc(id).update({status:"paid",date:firebase.firestore.FieldValue.serverTimestamp()});loadReferralRequests();loadStats();loadUsers();})}
function rejectReferral(id){db.collection("referralRequests").doc(id).update({status:"rejected"}).then(()=>loadReferralRequests());}

window.onload=function(){if(localStorage.getItem('nexaAdminLoggedIn')==='true'){showPanel();}}
</script>
</body>
</html>
