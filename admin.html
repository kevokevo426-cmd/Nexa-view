<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA ADMIN PANEL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Poppins;padding:15px;margin:0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logout-btn{background:#ef4444;color:white;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px}
.box{background:#111;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:15px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px}
.stat-card{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:12px;text-align:center}
.stat-card h4{color:#888;font-size:11px;margin:0;font-weight:400}
.stat-card p{color:#fbbf24;font-size:18px;font-weight:700;margin:5px 0 0 0}
.search-box{display:flex;align-items:center;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:10px;margin-bottom:15px}
.search-box input{flex:1;background:transparent;border:none;color:white;font-size:14px;outline:none;font-family:Poppins}
.search-icon{color:#fbbf24;font-size:18px;margin-right:8px}
h2{color:#fbbf24;text-align:center;margin:0}
h3{color:#fbbf24;margin:0 0 12px 0;font-size:15px}
.btn{padding:6px 10px;background:#22c55e;color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer;margin:2px;font-size:10px;font-family:Poppins}
.btn:hover{opacity:0.8}
.btn-red{background:#ef4444;color:white}
.btn-yellow{background:#f59e0b;color:#000}
.btn-blue{background:#3b82f6;color:white}
.req-card{background:#1a1a1a;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #333;font-size:12px;line-height:1.6}
.user-card{background:#1a1a1a;padding:10px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;border:1px solid #333;gap:10px}
.user-num{background:#fbbf24;color:#000;font-weight:700;font-size:11px;border-radius:6px;padding:4px 8px;min-width:28px;text-align:center;margin-top:3px}
.user-info{font-size:12px;line-height:1.7;flex:1}
.user-info b{color:#fbbf24}
.btn-group{display:flex;flex-direction:column;gap:4px}
input[type="number"], input[type="password"]{padding:10px;background:#222;border:1px solid #444;color:white;border-radius:8px;width:100%;font-family:Poppins;font-size:14px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;justify-content:center;align-items:center}
.modal-content{background:#111;width:90%;max-width:400px;border-radius:16px;padding:20px;border:1px solid #333}
.modal-content h3{margin-top:0;text-align:center}
/* LOGIN SCREEN */
#loginScreen{display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;justify-content:center;align-items:center}
.login-box{background:#111;padding:25px;border-radius:16px;border:1px solid #333;width:90%;max-width:350px;text-align:center}
.login-box h2{margin-bottom:15px}
.login-box input{margin-bottom:15px}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <h2>👑 NEXA ADMIN LOGIN</h2>
    <input type="password" id="adminPassword" placeholder="Enter Admin Password">
    <button class="btn btn-blue" style="width:100%;padding:10px;font-size:14px" onclick="checkLogin()">Login</button>
    <p id="loginError" style="color:#ef4444;font-size:12px;margin-top:10px"></p>
  </div>
</div>

<!-- MAIN PANEL -->
<div id="mainPanel" style="display:none">
  <div class="header">
    <h2>👑 NEXA ADMIN PANEL</h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- TOP STATS -->
  <div class="stats">
    <div class="stat-card"><h4>Total Users</h4><p id="totalUsers">0</p></div>
    <div class="stat-card"><h4>Total Invested</h4><p id="totalInvested">Ksh 0.00</p></div>
    <div class="stat-card"><h4>Total Income</h4><p id="totalIncome">Ksh 0.00</p></div>
    <div class="stat-card"><h4>Today's Income</h4><p id="todayIncome">Ksh 0.00</p></div>
  </div>

  <!-- PENDING WITHDRAWALS -->
  <div class="box">
    <h3>💸 Pending Withdrawals</h3>
    <div id="withdrawList">Loading...</div>
  </div>

  <!-- USERS -->
  <div class="box">
    <h3>👥 All Users</h3>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search by Phone, User ID, or Ref Code...">
    </div>
    <div id="userList">Loading...</div>
  </div>

  <!-- DEPOSIT MODAL -->
  <div id="depositModal" class="modal" onclick="closeDepositModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Add Balance to User</h3>
      <p id="depositUserPhone" style="color:#fbbf24;font-weight:600"></p>
      <label>Amount to Add KSH</label>
      <input id="depositAmountInput" type="number" placeholder="500">
      <div style="margin-top:15px;display:flex;gap:8px">
        <button class="btn btn-blue" style="flex:1" onclick="confirmDeposit()">Add Money</button>
        <button class="btn btn-red" style="flex:1" onclick="closeDepositModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",
  authDomain:"nexa-view.firebaseapp.com",
  projectId:"nexa-view"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== ADMIN PASSWORD SETTINGS =====
const ADMIN_PASSWORD = "nexa2026"; // <-- CHANGE THIS PASSWORD
// ===================================

let selectedUserPhone = "";
let userCounter = 1;
let allUsers = [];

// CHECK LOGIN ON LOAD
window.onload = function(){
  if(localStorage.getItem('nexaAdminLoggedIn') === 'true'){
    showPanel();
  }
}

function checkLogin(){
  let pass = document.getElementById('adminPassword').value;
  if(pass === ADMIN_PASSWORD){
    localStorage.setItem('nexaAdminLoggedIn', 'true');
    showPanel();
  } else {
    document.getElementById('loginError').innerText = "❌ Wrong Password";
  }
}

function showPanel(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainPanel').style.display = 'block';
  loadUsers();
  loadWithdrawals();
}

function logout(){
  localStorage.removeItem('nexaAdminLoggedIn');
  location.reload();
}

// LOAD USERS WITH STATS
function loadUsers(){
  userCounter = 1;
  let totalUsers = 0;
  let totalInvested = 0;
  let totalIncome = 0;
  let todayIncome = 0;

  db.collection("users").orderBy("phone").get().then(snapshot=>{
    allUsers = [];
    totalUsers = snapshot.size;
    
    snapshot.forEach(doc=>{
      let u = doc.data();
      u.docId = doc.id;
      allUsers.push(u);
      
      let invested = u.totalInvested || 0;
      let income = u.totalIncome || 0;
      let todayInc = u.todayIncome || 0;

      totalInvested += invested;
      totalIncome += income;
      todayIncome += todayInc;
    });
    
    renderUsers(allUsers);
    document.getElementById('totalUsers').innerText = totalUsers;
    document.getElementById('totalInvested').innerText = `Ksh ${totalInvested.toFixed(2)}`;
    document.getElementById('totalIncome').innerText = `Ksh ${totalIncome.toFixed(2)}`;
    document.getElementById('todayIncome').innerText = `Ksh ${todayIncome.toFixed(2)}`;
  }).catch(err=>{
    document.getElementById('userList').innerHTML = "<p style='color:red'>Error loading users</p>";
  })
}

function renderUsers(users){
  let html = "";
  userCounter = 1;
  users.forEach(u=>{
    let products = u.productsBought || 0;
    let invested = u.totalInvested || 0;
    let income = u.totalIncome || 0;
    let todayInc = u.todayIncome || 0;

    html += `<div class="user-card">
      <div class="user-num">#${userCounter}</div>
      <div class="user-info">
        <b>${u.phone}</b><br>
        ID: ${u.userID || 'NO ID'} | Ref: ${u.myReferralCode || 'NO CODE'}<br>
        Balance: <b style="color:#22c55e">Ksh ${(u.balance||0).toFixed(2)}</b><br>
        📦 Products: <b>${products}</b><br>
        💰 Invested: <b style="color:#3b82f6">Ksh ${invested.toFixed(2)}</b><br>
        📈 Total Income: <b style="color:#22c55e">Ksh ${income.toFixed(2)}</b><br>
        🔥 Today: <b style="color:#f59e0b">Ksh ${todayInc.toFixed(2)}</b>
      </div>
      <div class="btn-group">
        <button class="btn btn-blue" onclick="openDepositModal('${u.phone}')">Deposit</button>
        <button class="btn btn-yellow" onclick="resetPass('${u.phone}')">Reset</button>
        <button class="btn btn-red" onclick="deleteUser('${u.phone}')">Delete</button>
      </div>
    </div>`;
    userCounter++;
  });
  document.getElementById('userList').innerHTML = html || "<p style='color:#888;text-align:center'>No users found</p>";
}

// SEARCH FUNCTION
document.getElementById('searchInput').addEventListener('keyup', function(){
  let query = this.value.toLowerCase();
  let filtered = allUsers.filter(u=>{
    return (u.phone && u.phone.toLowerCase().includes(query)) ||
           (u.userID && u.userID.toLowerCase().includes(query)) ||
           (u.myReferralCode && u.myReferralCode.toLowerCase().includes(query));
  });
  renderUsers(filtered);
});

// DEPOSIT FUNCTIONS
function openDepositModal(phone){
  selectedUserPhone = phone;
  document.getElementById('depositUserPhone').innerText = "User: " + phone;
  document.getElementById('depositModal').style.display = 'flex';
}

function closeDepositModal(){
  document.getElementById('depositModal').style.display = 'none';
  document.getElementById('depositAmountInput').value = "";
}

function confirmDeposit(){
  let amount = parseFloat(document.getElementById('depositAmountInput').value);
  if(!amount || amount <= 0){ alert("Enter valid amount"); return; }
  db.collection("users").doc(selectedUserPhone).get().then(doc=>{
    let newBal = (doc.data().balance || 0) + amount;
    db.collection("users").doc(selectedUserPhone).update({balance: newBal}).then(()=>{
      alert(`✅ Added Ksh ${amount} to ${selectedUserPhone}`);
      closeDepositModal();
      loadUsers();
    })
  })
}

// USER MANAGEMENT
function resetPass(phone){
  let newPass = prompt("Enter new password for " + phone);
  if(newPass){ 
    db.collection("users").doc(phone).update({password: newPass})
    .then(()=>alert("✅ Password reset"))
  }
}

function deleteUser(phone){
  if(confirm("Delete user " + phone + "? This cannot be undone.")){ 
    db.collection("users").doc(phone).delete()
    .then(()=>{alert("✅ User deleted"); loadUsers();})
  }
}

// LOAD WITHDRAWALS
function loadWithdrawals(){
  db.collection("withdrawals").where("status","==","pending").orderBy("date","desc").get().then(snapshot=>{
    let html = "";
    if(snapshot.empty){ html = "<p style='color:#888;text-align:center'>No pending withdrawals</p>"; }
    snapshot.forEach(doc=>{
      let d = doc.data();
      let date = d.date ? d.date.toDate().toLocaleString() : 'N/A';
      html += `<div class="req-card">
        <b>User:</b> ${d.phone}<br>
        <b>Amount:</b> Ksh ${d.amount}<br>
        <b>Time:</b> ${date}<br>
        <button class="btn" onclick="approveWithdraw('${doc.id}')">Mark Paid</button>
        <button class="btn-red" onclick="rejectWithdraw('${doc.id}')">Reject</button>
      </div>`;
    });
    document.getElementById('withdrawList').innerHTML = html;
  }).catch(err=>{
    document.getElementById('withdrawList').innerHTML = "<p style='color:red'>Error loading withdrawals</p>";
  })
}

function approveWithdraw(id){
  db.collection("withdrawals").doc(id).update({status:"paid"})
  .then(()=>{alert("✅ Marked as Paid. Send MPESA manually"); loadWithdrawals();});
}

function rejectWithdraw(id){
  db.collection("withdrawals").doc(id).update({status:"rejected"})
  .then(()=>loadWithdrawals());
}

// Auto refresh withdrawals
setInterval(()=>{
  if(localStorage.getItem('nexaAdminLoggedIn') === 'true'){
    loadWithdrawals();
  }
}, 10000);
</script>
</body>
</html>
