<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA USER PANEL</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Poppins;padding:15px;margin:0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h2{color:#fbbf24;margin:0;font-size:18px}
.logout-btn{background:#ef4444;color:white;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px}
.card{background:#111;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:15px}
.top-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#888;margin-bottom:10px}
.top-row b{color:#fbbf24}
.row{font-size:13px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.row b{font-weight:700}
.balance{color:#22c55e;font-size:16px}
.invested{color:#3b82f6}
.income{color:#22c55e}
.today{color:#f59e0b}
.ref{color:#8b5cf6}
.products{color:#fbbf24}
.btn{padding:10px 12px;background:#3b82f6;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;flex:1}
.btn-red{background:#ef4444}
.btn-orange{background:#f59e0b;color:#000}
.btn-group{display:flex;gap:8px;margin-top:12px}
#loginScreen{display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;justify-content:center;align-items:center}
.login-box{background:#111;padding:25px;border-radius:16px;border:1px solid #333;width:90%;max-width:350px;text-align:center}
.login-box input{padding:10px;background:#222;border:1px solid #444;color:white;border-radius:8px;width:100%;margin-bottom:10px;font-family:Poppins}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2 style="color:#fbbf24">👤 USER LOGIN</h2>
    <input type="text" id="loginPhone" placeholder="Enter Phone Number">
    <button class="btn" style="width:100%" onclick="loginUser()">Login</button>
    <p id="loginError" style="color:#ef4444;font-size:12px"></p>
  </div>
</div>

<div id="mainPanel" style="display:none">
  <div class="header">
    <h2>👤 NEXA USER PANEL</h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
  <div id="userCard">Loading...</div>
</div>

<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let currentUserPhone = "";

// LOGIN
function loginUser(){
  let phone = document.getElementById('loginPhone').value.trim();
  if(!phone){ document.getElementById('loginError').innerText="Enter phone"; return; }
  
  db.collection("users").doc(phone).get().then(doc=>{
    if(doc.exists){
      currentUserPhone = phone;
      localStorage.setItem('nexaUserPhone', phone);
      showPanel();
    } else {
      document.getElementById('loginError').innerText="User not found";
    }
  })
}

function showPanel(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainPanel').style.display='block';
  loadUserData();
}

function logout(){
  localStorage.removeItem('nexaUserPhone');
  location.reload();
}

// AUTO LOAD + CALCULATE ALL 7 FIELDS
function loadUserData(){
  db.collection("users").doc(currentUserPhone).onSnapshot(doc=>{
    if(!doc.exists) return;
    let u = doc.data();
    
    // AUTO CALCULATIONS
    let products = u.productsPurchased || 0;
    let invested = u.totalInvested || 0;
    let totalIncome = (u.totalWithdrawn || 0) + (u.totalReferralEarned || 0);
    let todayIncome = (u.todayIncome || 0) + (u.todayReferralIncome || 0);
    let referrals = u.referralCount || 0;
    let referralIncome = u.totalReferralEarned || 0;
    let balance = u.balance || 0;

    let h = `
    <div class="card">
      <div class="top-row">
        <span><b>${u.phone}</b></span>
        <span>ID: ${u.userID || 'NO ID'}</span>
      </div>
      <div class="top-row">
        <span>Ref Code: <b style="color:#8b5cf6">${u.refCode || 'NO CODE'}</b></span>
      </div>
      
      <div class="row"><span>💰 Balance:</span><b class="balance">Ksh ${balance.toFixed(2)}</b></div>
      <div class="row"><span>📦 Products:</span><b class="products">${products}</b></div>
      <div class="row"><span>💵 Invested:</span><b class="invested">Ksh ${invested.toFixed(2)}</b></div>
      <div class="row"><span>📈 Total Income:</span><b class="income">Ksh ${totalIncome.toFixed(2)}</b></div>
      <div class="row"><span>🔥 Today's Income:</span><b class="today">Ksh ${todayIncome.toFixed(2)}</b></div>
      <div class="row"><span>👥 Referrals:</span><b class="ref">${referrals}</b></div>
      <div class="row"><span>🎁 Referral Income:</span><b class="ref">Ksh ${referralIncome.toFixed(2)}</b></div>

      <div class="btn-group">
        <button class="btn" onclick="withdraw()">Withdraw</button>
        <button class="btn btn-orange" onclick="requestBonus()">Request Bonus</button>
      </div>
    </div>
    `;
    document.getElementById('userCard').innerHTML = h;
  })
}

function withdraw(){ alert("Withdraw function here"); }
function requestBonus(){ alert("Request referral bonus"); }

window.onload=function(){
  let saved = localStorage.getItem('nexaUserPhone');
  if(saved){ currentUserPhone = saved; showPanel(); }
}
</script>
</body>
</html>
