<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA ADMIN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
body{background:#000;color:white;font-family:Poppins;padding:20px}
.login-box{max-width:400px;margin:100px auto;background:#111;padding:30px;border-radius:16px;border:1px solid #fbbf24}
input,button{width:100%;padding:14px;margin:10px 0;background:#222;border:1px solid #333;color:white;border-radius:10px;font-size:15px;box-sizing:border-box}
button{background:#fbbf24;color:black;font-weight:bold;cursor:pointer}
.card{background:#111;padding:20px;border-radius:16px;margin:15px 0;border:1px solid #222}
.user-row{display:flex;justify-content:space-between;align-items:center;background:#1a1a1a;padding:12px;border-radius:10px;margin:8px 0}
.user-row button{width:auto;padding:8px 12px;margin-left:5px;font-size:12px}
.red{background:#ef4444;color:white}
.orange{background:#f59e0b;color:white}
.green{background:#22c55e;color:white}
</style>
</head>
<body>

<div id="loginBox" class="login-box">
  <h2 style="color:#fbbf24;text-align:center">ADMIN LOGIN</h2>
  <input type="password" id="adminPass" placeholder="Enter Admin Password">
  <button onclick="loginAdmin()">LOGIN</button>
  <p id="loginError" style="color:red;text-align:center"></p>
</div>

<div id="adminPanel" style="display:none">
  <h1>NEXA ADMIN PANEL</h1><button onclick="logout()" class="red" style="width:auto;float:right">LOGOUT</button>
  
  <div class="card">
    <h3>Add User</h3>
    <input id="addUserPhone" placeholder="Phone: 0712345678 or 254712345678">
    <input id="addUserName" placeholder="Real Name">
    <input id="addUserPass" placeholder="Password">
    <input id="addUserBalance" placeholder="Starting Balance e.g 0">
    <button onclick="addUser()">ADD USER</button>
  </div>

  <div class="card">
    <h3>💰 Add Balance to User - DEPOSIT</h3>
    <input id="depositPhone" placeholder="Phone: 0712345678">
    <input id="depositAmount" placeholder="Amount e.g 50000">
    <button onclick="addBalance()">ADD BALANCE</button>
    <div id="depositMsg"></div>
  </div>

  <div class="card">
    <h3>🔥 Pending Withdrawals</h3><div id="withdrawList">Loading...</div>
  </div>

  <div class="card">
    <h3>All Users</h3><div id="userList"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const ADMIN_PASSWORD = "nexa2025"; // CHANGE THIS

function formatPhone(p){
  if(!p) return '';
  p = p.replace(/\D/g,'');
  if(p.startsWith('0')) return '254' + p.substring(1);
  if(p.startsWith('7')) return '254' + p;
  return p;
}

function loginAdmin(){ 
  const pass = document.getElementById('adminPass').value;
  if(pass === ADMIN_PASSWORD){ 
    document.getElementById('loginBox').style.display='none'; 
    document.getElementById('adminPanel').style.display='block'; 
    loadAdminData(); 
  } else { 
    document.getElementById('loginError').innerText = '❌ Wrong Password' 
  }
}
function logout(){ document.getElementById('loginBox').style.display='block'; document.getElementById('adminPanel').style.display='none'; }

function loadAdminData(){
  db.collection("users").onSnapshot(snap=>{
    let html='';
    snap.forEach(d=>{ let u=d.data();
      html+=`<div class="user-row"><div><b>${u.realName}</b><br><small>${d.id}</small><br><small>Balance: Ksh ${u.balance}</small></div>
      <div><button class="orange" onclick="resetPass('${d.id}')">Reset Pass</button><button class="red" onclick="deleteUser('${d.id}')">Delete</button></div></div>`;
    });
    document.getElementById('userList').innerHTML = html || "No users";
  });
  db.collection("withdrawals").where("status","==","pending").onSnapshot(snap=>{
    let html=''; snap.forEach(d=>{ let w=d.data();
      html+=`<div class="user-row"><div><b>Ksh ${w.amount}</b><br><small>User: ${w.phone}</small><br><small>To: ${w.mpesa}</small></div>
      <div><button class="green" onclick="approveWithdraw('${d.id}', '${w.phone}', ${w.amount})">APPROVE</button><button class="red" onclick="rejectWithdraw('${d.id}')">REJECT</button></div></div>`;
    });
    document.getElementById('withdrawList').innerHTML = html || "No pending withdrawals";
  });
}

function addUser(){
  const phone = formatPhone(document.getElementById('addUserPhone').value.trim());
  const name = document.getElementById('addUserName').value.trim();
  const pass = document.getElementById('addUserPass').value.trim();
  const balance = parseFloat(document.getElementById('addUserBalance').value) || 0;
  if(!phone ||!name ||!pass){ alert('Fill all fields'); return; }
  db.collection("users").doc(phone).set({
    phone, realName:name, password:pass, balance, ownedPackages:{}, tasksDone:0, referralBonus:0, createdAt:new Date()
  }).then(()=>alert('✅ User Created: '+phone));
}

function addBalance(){
  const phone = formatPhone(document.getElementById('depositPhone').value.trim());
  const amount = parseFloat(document.getElementById('depositAmount').value);
  const msg = document.getElementById('depositMsg');
  if(!phone ||!amount){ msg.innerHTML='<p style="color:red">Fill all</p>'; return; }
  db.collection("users").doc(phone).get().then(doc=>{
    if(!doc.exists){ msg.innerHTML='<p style="color:red">❌ User not found</p>'; return; }
    const newBalance = doc.data().balance + amount;
    let batch = db.batch();
    batch.update(db.collection("users").doc(phone), {balance:newBalance});
    batch.set(db.collection("transactions").doc(), {phone, type:"deposit", amount, time:new Date()});
    batch.commit().then(()=>{ msg.innerHTML=`<p style="color:#22c55e">✅ Deposited Ksh ${amount}</p>`; });
  });
}

function approveWithdraw(id, phone, amount){
  if(!confirm(`Deduct Ksh ${amount} from ${phone}?`)) return;
  db.collection("users").doc(phone).get().then(doc=>{
    let newBalance = doc.data().balance - amount;
    let batch = db.batch();
    batch.update(db.collection("users").doc(phone), {balance:newBalance});
    batch.update(db.collection("withdrawals").doc(id), {status:"approved", approvedAt:new Date()});
    batch.set(db.collection("transactions").doc(), {phone, type:"withdraw", amount, time:new Date()});
    batch.commit().then(()=>alert('✅ Approved and Deducted'));
  });
}
function rejectWithdraw(id){ db.collection("withdrawals").doc(id).update({status:"rejected"}).then(()=>alert('❌ Rejected')); }
function resetPass(phone){ const np=prompt("New Password"); if(np) db.collection("users").doc(phone).update({password:np}).then(()=>alert('✅ Password Reset')); }
function deleteUser(phone){ if(confirm('Delete '+phone+'?')) db.collection("users").doc(phone).delete().then(()=>alert('Deleted')); }
</script>
</body>
</html>
