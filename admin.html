<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA USER</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:white;font-family:Poppins;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.box{background:#111;border:1px solid #333;border-radius:16px;padding:25px;width:100%;max-width:380px;text-align:center}
.box h2{color:#fbbf24;margin-bottom:20px;font-size:20px}
input{width:100%;padding:12px;background:#222;border:1px solid #444;color:white;border-radius:10px;margin-bottom:12px;font-size:14px;font-family:Poppins;outline:none}
.btn{width:100%;padding:12px;background:#3b82f6;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;font-family:Poppins}
.btn:hover{opacity:0.9}
.card{background:#111;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:12px;width:100%;max-width:380px}
.row{display:flex;justify-content:space-between;margin:10px 0;font-size:14px;border-bottom:1px solid #1a1a1a;padding-bottom:8px}
.row:last-child{border:none}
.row b{font-weight:700}
.green{color:#22c55e}
.blue{color:#3b82f6}
.orange{color:#f59e0b}
.purple{color:#8b5cf6}
.yellow{color:#fbbf24}
.logout{background:#ef4444;margin-top:12px}
#error{color:#ef4444;font-size:12px;margin-top:8px}
#dashboard{display:none;flex-direction:column;align-items:center;width:100%}
.top-info{text-align:center;margin-bottom:12px}
.top-info h3{color:#fbbf24;font-size:16px}
.top-info p{color:#888;font-size:12px}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login" class="box">
  <h2>👤 USER LOGIN</h2>
  <input type="text" id="phone" placeholder="Enter Phone Number">
  <button class="btn" onclick="login()">Login</button>
  <p id="error"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="card">
    <div class="top-info">
      <h3 id="uPhone"></h3>
      <p>ID: <span id="uID"></span> | Ref: <span id="uRef"></span></p>
    </div>

    <div class="row"><span>💰 Balance</span><b class="green" id="uBalance">Ksh 0.00</b></div>
    <div class="row"><span>📦 Products - Levels Purchased</span><b class="yellow" id="uProducts">0</b></div>
    <div class="row"><span>💵 Invested - Total Bought</span><b class="blue" id="uInvested">Ksh 0.00</b></div>
    <div class="row"><span>📈 Total Income - Withdrawals + Bonus</span><b class="green" id="uTotalIncome">Ksh 0.00</b></div>
    <div class="row"><span>🔥 Today's Income - Profits of Day</span><b class="orange" id="uToday">Ksh 0.00</b></div>
    <div class="row"><span>👥 Referrals - Joined + Purchased</span><b class="purple" id="uReferrals">0</b></div>
    <div class="row"><span>🎁 Referral Income</span><b class="purple" id="uRefIncome">Ksh 0.00</b></div>
    
    <button class="btn logout" onclick="logout()">Logout</button>
  </div>
</div>

<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentPhone = "";

// LOGIN
function login(){
  let phone = document.getElementById('phone').value.trim();
  if(!phone){ document.getElementById('error').innerText="Enter phone number"; return; }
  
  db.collection("users").doc(phone).get().then(doc=>{
    if(doc.exists){
      currentPhone = phone;
      localStorage.setItem('nexaUser', phone);
      showDashboard();
    } else {
      document.getElementById('error').innerText="❌ User not found";
    }
  })
}

// SHOW DASHBOARD + AUTO CALCULATE
function showDashboard(){
  document.getElementById('login').style.display='none';
  document.getElementById('dashboard').style.display='flex';
  
  db.collection("users").doc(currentPhone).onSnapshot(doc=>{
    if(!doc.exists) return;
    let u = doc.data();
    
    // YOUR 7 FIELDS CALCULATION
    let products = u.productsPurchased || 0; // levels purchased
    let invested = u.totalInvested || 0; // total amount of products bought
    let totalIncome = (u.totalWithdrawn || 0) + (u.totalReferralEarned || 0); // withdrawals + bonuses
    let todayIncome = (u.todayIncome || 0) + (u.todayReferralIncome || 0); // profits of the day
    let referrals = u.referralCount || 0; // users joined with link + purchased
    let refIncome = u.totalReferralEarned || 0; // earned from referrals
    let balance = u.balance || 0; // amount in account

    // PUT IN HTML
    document.getElementById('uPhone').innerText = u.phone || currentPhone;
    document.getElementById('uID').innerText = u.userID || 'N/A';
    document.getElementById('uRef').innerText = u.refCode || 'N/A';
    document.getElementById('uBalance').innerText = `Ksh ${balance.toFixed(2)}`;
    document.getElementById('uProducts').innerText = products;
    document.getElementById('uInvested').innerText = `Ksh ${invested.toFixed(2)}`;
    document.getElementById('uTotalIncome').innerText = `Ksh ${totalIncome.toFixed(2)}`;
    document.getElementById('uToday').innerText = `Ksh ${todayIncome.toFixed(2)}`;
    document.getElementById('uReferrals').innerText = referrals;
    document.getElementById('uRefIncome').innerText = `Ksh ${refIncome.toFixed(2)}`;
  })
}

function logout(){
  localStorage.removeItem('nexaUser');
  location.reload();
}

// AUTO LOGIN IF SAVED
window.onload=function(){
  let saved = localStorage.getItem('nexaUser');
  if(saved){ currentPhone = saved; showDashboard(); }
}
</script>
</body>
</html>
