<!DOCTYPE html>
<html lang="en">
<head>

<title>NEXA ADMIN PANEL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Poppins;padding:15px;margin:0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header-actions{display:flex;gap:8px;align-items:center}
.logout-btn{background:#ef4444;color:white;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px}
.broadcast-btn{background:#8b5cf6;color:white;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px}
.notif-btn{background:#1a1a1a;border:1px solid #333;color:#fbbf24;border:none;padding:8px 10px;border-radius:8px;font-size:18px;cursor:pointer;position:relative}
.notif-badge{position:absolute;top:-5px;right:-5px;background:#ef4444;color:white;border-radius:50%;font-size:10px;font-weight:700;padding:2px 6px;min-width:18px;text-align:center}
.box{background:#111;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:15px}
.pending-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
.stat-card{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:12px;text-align:center}
.stat-card h4{color:#888;font-size:11px;margin:0;font-weight:400}
.stat-card p{font-size:16px;font-weight:700;margin:5px 0 0 0}
.search-box{display:flex;align-items:center;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:10px;margin-bottom:15px}
.search-box input{flex:1;background:transparent;border:none;color:white;font-size:14px;outline:none;font-family:Poppins}
.search-icon{color:#fbbf24;font-size:18px;margin-right:8px}
h2{color:#fbbf24;text-align:center;margin:0}
h3{color:#fbbf24;margin:0 0 12px 0;font-size:15px}
.btn{padding:6px 10px;background:#22c55e;color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer;margin:2px;font-size:10px;font-family:Poppins}
.btn:hover{opacity:0.8}
.btn-red{background:#ef4444;color:white}
.btn-yellow{background:#f59e0b;color:#000}
.btn-blue{background:#3b82f6;color:white}
.btn-purple{background:#8b5cf6;color:white}
.req-card{background:#1a1a1a;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #333;font-size:12px;line-height:1.6}
.message-card{background:#1a1a1a;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #333;border-left:4px solid #8b5cf6;cursor:pointer;transition:0.2s}
.message-card:hover{background:#222}
.message-card.read{opacity:0.5;border-left-color:#333}
.message-card.broadcast{border-left-color:#f59e0b}
.user-card{background:#1a1a1a;padding:10px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;border:1px solid #333;gap:10px;cursor:pointer;transition:0.2s}
.user-card:hover{border-color:#fbbf24;background:#1f1f1f}
.user-num{background:#fbbf24;color:#000;font-weight:700;font-size:11px;border-radius:6px;padding:4px 8px;min-width:28px;text-align:center;margin-top:3px}
.user-info{font-size:12px;line-height:1.7;flex:1}
.user-info b{color:#fbbf24}
.btn-group{display:flex;flex-direction:column;gap:4px}
input[type="number"], input[type="password"], input[type="text"], textarea{padding:10px;background:#222;border:1px solid #444;color:white;border-radius:8px;width:100%;font-family:Poppins;font-size:14px}
textarea{resize:vertical;min-height:80px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;justify-content:center;align-items:center}
.modal-content{background:#111;width:90%;max-width:450px;border-radius:16px;padding:20px;border:1px solid #333;max-height:90vh;overflow-y:auto}
.modal-content h3{margin-top:0;text-align:center;color:#fbbf24}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:13px}
.info-row:last-child{border:none}
.info-label{color:#888}
.info-value{color:white;font-weight:600}
.referral-item{background:#1a1a1a;padding:8px;border-radius:8px;margin-bottom:6px;border:1px solid #333;font-size:12px}
#loginScreen{display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;justify-content:center;align-items:center}
.login-box{background:#111;padding:25px;border-radius:16px;border:1px solid #333;width:90%;max-width:350px;text-align:center}
.login-box h2{margin-bottom:15px}
.password-wrapper{position:relative;margin-bottom:15px}
.password-wrapper input{padding-right:40px}
.eye-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px;color:#888;user-select:none;z-index:10}
.eye-icon:hover{color:#fbbf24}
@media(max-width:768px){.pending-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
