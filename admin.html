<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA ADMIN</title>
<style>
body{background:#000;color:white;font-family:Poppins;padding:20px}
h1{color:#fbbf24;text-align:center}
.box{background:#111;padding:15px;border-radius:12px;margin-bottom:15px;border:1px solid #222}
input,textarea{width:100%;padding:12px;margin:6px 0;background:#1a1a1a;border:1px solid #333;color:white;border-radius:8px}
button{padding:12px 16px;background:#fbbf24;color:black;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:4px 2px}
.orange{background:#f59e0b}
.red{background:#ef4444}
.green{background:#22c55e}
.user-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #222;font-size:13px}
</style>
</head>
<body>
<h1>NEXA ADMIN PANEL</h1>

<div class="box">
  <h3>Settings</h3>
  <button onclick="showTab('users',this)">Users</button>
  <button class="orange" onclick="showTab('referrals',this)">Referral Bonuses</button>
  <button class="orange" onclick="showTermsEditor()">Edit Terms</button>
  <button class="green" onclick="logout()">Logout</button>
</div>

<div class="box" id="usersTab">
  <h3>Users</h3>
  <div id="userList">Loading...</div>
</div>

<div class="box" id="refTab" style="display:none">
  <h3>Pending Referral Bonuses - 10%</h3>
  <div id="refList">Loading...</div>
</div>

<!-- TERMS EDITOR POPUP -->
<div id="termsEditor" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:999;overflow-y:auto;padding:15px">
  <div style="background:#111;border:1px solid #fbbf24;border-radius:16px;padding:20px;max-width:700px;margin:20px auto">
    <h2 style="color:#fbbf24;text-align:center">Edit Terms & Conditions</h2>
    <textarea id="termsText" style="width:100%;height:400px;background:#1a1a1a;color:white;border:1px solid #333;border-radius:10px;padding:15px;font-family:Poppins;font-size:13px;line-height:1.6"></textarea>
    <button onclick="saveTerms()" style="width:100%;margin-top:10px;padding:14px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:black;border:none;border-radius:10px;font-weight:700">SAVE TERMS</button>
    <button onclick="closeTermsEditor()" style="width:100%;margin-top:8px;padding:14px;background:#333;color:white;border:none;border-radius:10px;font-weight:700">CLOSE</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// CHECK ADMIN LOGIN
if(localStorage.getItem("nexaAdmin") !== "true"){ window.location.href = "index.html"; }

function logout(){ localStorage.removeItem("nexaAdmin"); window.location.href = "index.html"; }

function showTab(tab,el){
  document.getElementById('usersTab').style.display = tab=='users'?'block':'none';
  document.getElementById('refTab').style.display = tab=='referrals'?'block':'none';
  if(tab=='referrals') loadReferrals();
}

// LOAD USERS
function loadUsers(){
  db.collection("users").get().then(snap=>{
    let html = '';
    snap.forEach(d=>{
      let u = d.data();
      html+=`<div class="user-row">
        <div>
          <b>${u.username || d.id}</b><br>
          <small>ID: ${u.userID || 'NO ID'}</small><br>
          <small>Ref: ${u.myReferralCode || 'NO CODE'}</small><br>
          <small>Phone: ${d.id}</small><br>
          <small>Balance: Ksh ${u.balance}</small>
        </div>
        <div>
          <button class="orange" onclick="resetPass('${d.id}')">Reset Pass</button>
          <button class="red" onclick="deleteUser('${d.id}')">Delete</button>
        </div>
      </div>`;
    });
    document.getElementById('userList').innerHTML = html || "No users yet";
  })
}
loadUsers();

function resetPass(phone){
  let np = prompt("New password for " + phone);
  if(np){ db.collection("users").doc(phone).update({password:np}).then(()=>alert('✅ Password Reset')) }
}
function deleteUser(phone){
  if(confirm("Delete " + phone + "?")){ db.collection("users").doc(phone).delete().then(()=>{alert('✅ Deleted'); loadUsers();}) }
}

// REFERRAL BONUSES
function loadReferrals(){
  db.collection("referralBonuses").where("status", "==", "pending").get().then(snap=>{
    let html = '';
    snap.forEach(d=>{
      let b = d.data();
      html+=`<div class="user-row">
        <div>
          <b>Referrer:</b> ${b.referrerPhone}<br>
          <b>Referred:</b> ${b.referredName} - ${b.referredPhone}<br>
          <b>Package:</b> Ksh ${b.packagePrice}<br>
          <b>Bonus 10%:</b> Ksh ${b.bonusAmount}
        </div>
        <button class="green" onclick="approveBonus('${d.id}','${b.referrerPhone}',${b.bonusAmount})">APPROVE</button>
      </div>`;
    })
    document.getElementById('refList').innerHTML = html || "No pending bonuses";
  })
}

function approveBonus(bonusID, refPhone, amount){
  db.collection("users").doc(refPhone).update({
    balance: firebase.firestore.FieldValue.increment(amount),
    referralBonus: firebase.firestore.FieldValue.increment(amount)
  })
  db.collection("referralBonuses").doc(bonusID).update({status: 'approved', approvedAt: new Date()})
  alert(`✅ Ksh ${amount} Bonus sent to ${refPhone}`);
  loadReferrals();
}

// TERMS EDITOR
function showTermsEditor(){
  document.getElementById('termsEditor').style.display = 'block';
  db.collection("settings").doc("terms").get().then(doc=>{
    if(doc.exists){
      document.getElementById('termsText').value = doc.data().content;
    }else{
      document.getElementById('termsText').value = `1. About: NEXA VIEW is an online platform where users earn rewards by completing daily tasks.\nAvailable in Kenya, Uganda, and Tanzania.\n\n2. Eligibility: You must be 18+ years old and have a valid phone number from KE, UG, or TZ.\n\n3. Earnings: Earnings are NOT guaranteed. Tasks depend on advertisers. Sunday is a rest day.\n\n4. Withdrawals: Min: Ksh 200 / UGX 6,000 / TZS 4,000. 15% fee. 9AM-5PM. 1 per day.`;
    }
  })
}
function closeTermsEditor(){ document.getElementById('termsEditor').style.display = 'none'; }
function saveTerms(){
  let content = document.getElementById('termsText').value;
  db.collection("settings").doc("terms").set({content: content, updated: new Date()}).then(()=>{
    alert('✅ Terms Updated Successfully');
    closeTermsEditor();
  })
}
</script>
</body>
</html>
