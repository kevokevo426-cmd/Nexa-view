<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA VIEW</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0a0a0a; color: white; font-family: 'Arial', sans-serif; }
  .gradient-btn { background: linear-gradient(90deg, #FFD700, #FFA500); }
  .card { background: #1a1a1a; border: 1px solid #333; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div id="app" class="w-full max-w-md">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="card p-6 rounded-2xl">
    <h1 class="text-3xl font-bold text-center text-yellow-400 mb-6">NEXA VIEW</h1>
    <input id="loginPhone" type="tel" placeholder="Phone Number" class="w-full p-3 mb-3 bg-black border-gray-600 rounded">
    <input id="loginPin" type="password" placeholder="4 Digit PIN" maxlength="4" class="w-full p-3 mb-4 bg-black border-gray-600 rounded">
    <button onclick="login()" class="w-full gradient-btn text-black font-bold p-3 rounded">LOGIN</button>
    <p class="text-center mt-4">No account? <button onclick="showSignup()" class="text-yellow-400 underline font-bold">Create One</button></p>
  </div>

  <!-- SIGNUP SCREEN -->
  <div id="signupScreen" class="card p-6 rounded-2xl hidden">
    <h1 class="text-2xl font-bold text-center text-yellow-400 mb-6">CREATE ACCOUNT</h1>
    <input id="signupName" type="text" placeholder="Username" class="w-full p-3 mb-3 bg-black border-gray-600 rounded">
    <input id="signupPhone" type="tel" placeholder="Phone Number" class="w-full p-3 mb-3 bg-black border border-gray-600 rounded">
    <input id="signupPin" type="password" placeholder="Create 4 Digit PIN" maxlength="4" class="w-full p-3 mb-4 bg-black border-gray-600 rounded">
    <button onclick="createAccount()" class="w-full gradient-btn text-black font-bold p-3 rounded">CREATE ACCOUNT</button>
    <p class="text-center mt-4">Have account? <button onclick="showLogin()" class="text-yellow-400 underline font-bold">Login</button></p>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboard" class="hidden">
    <div class="card p-4 rounded-xl">
      <h1 class="text-2xl font-bold text-yellow-400">Welcome <span id="userName"></span></h1>
      <p class="text-gray-400">Balance: Ksh <span id="userBalance">0</span></p>
    </div>
    <div class="card p-4 rounded-xl mt-4">
      <p class="font-bold">Watch Ads & Earn</p>
      <button onclick="watchAd()" class="w-full gradient-btn text-black font-bold p-3 rounded mt-2">WATCH AD +Ksh 2</button>
    </div>
    <button onclick="logout()" class="w-full bg-red-600 p-3 rounded mt-4 font-bold">LOGOUT</button>
  </div>

</div>


<!-- FIREBASE SDK -->
<script type="module">
  // Import the functions you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, child, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // YOUR WEB APP'S FIREBASE CONFIGURATION
  const firebaseConfig = {
    apiKey: "AIzaSyD1ftJH9O9fbV9X5oUr8r5c9YkeV7N1ecI",
    authDomain: "nexa-view.firebaseapp.com",
    databaseURL: "https://nexa-view-default-rtdb.firebaseio.com",
    projectId: "nexa-view",
    storageBucket: "nexa-view.firebasestorage.app",
    messagingSenderId: "947915083946",
    appId: "1:947915083946:web:7f2cb69ddbc2f8bd2ec0d3",
    measurementId: "G-Q2ZD17234K"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentUser = null;

  // SCREEN FUNCTIONS
  window.showSignup = function() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('signupScreen').classList.remove('hidden');
  }
  window.showLogin = function() {
    document.getElementById('signupScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
  }

  // CREATE ACCOUNT
  window.createAccount = function() {
    const name = document.getElementById('signupName').value;
    const phone = document.getElementById('signupPhone').value;
    const pin = document.getElementById('signupPin').value;

    if(!name || !phone || pin.length !== 4) return alert("Fill all fields. PIN must be 4 digits");

    set(ref(db, 'users/' + phone), {
      username: name,
      pin: pin,
      balance: 0,
      package: null,
      adsWatchedToday: 0
    }).then(() => {
      alert("Account Created! Now Login");
      showLogin();
    }).catch((error) => alert(error.message));
  }

  // LOGIN
  window.login = function() {
    const phone = document.getElementById('loginPhone').value;
    const pin = document.getElementById('loginPin').value;

    get(child(ref(db), `users/${phone}`)).then((snapshot) => {
      if (snapshot.exists() && snapshot.val().pin === pin) {
        currentUser = snapshot.val();
        currentUser.phone = phone;
        document.getElementById('userName').innerText = currentUser.username;
        document.getElementById('userBalance').innerText = currentUser.balance;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
      } else {
        alert("Wrong phone or PIN");
      }
    });
  }

  // WATCH AD - ADDS 2 KSH
  window.watchAd = function() {
    if(!currentUser) return;
    const newBalance = currentUser.balance + 2;
    update(ref(db, 'users/' + currentUser.phone), {
      balance: newBalance
    }).then(() => {
      currentUser.balance = newBalance;
      document.getElementById('userBalance').innerText = newBalance;
      alert("Earned Ksh 2! New Balance: " + newBalance);
    });
  }

  // LOGOUT
  window.logout = function() {
    currentUser = null;
    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
  }

</script>
</body>
</html>
