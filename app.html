<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA VIEW</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;text-align:center;padding:20px}
h1{color:#00FF00;font-size:32px}
input{width:90%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#1a1a1a;color:white}
button{width:90%;padding:14px;margin:10px 0;border-radius:8px;border:none;background:#00FF00;color:black;font-weight:bold;font-size:16px;cursor:pointer}
.card{background:#111;padding:20px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>

<div id="signup">
<h1>NEXA VIEW</h1>
<p>Invest. Watch 2 Minutes. Earn Daily.</p>
<input type="text" id="username" placeholder="Username">
<input type="text" id="phone" placeholder="Phone: 07XXXXXXXX">
<input type="password" id="pin" placeholder="4 Digit PIN" maxlength="4">
<button onclick="createAccount()">Create Account</button>
<p>Already have account? <a href="#" onclick="showLogin()" style="color:#00FF00">Login</a></p>
</div>

<div id="login" style="display:none">
<h1>NEXA VIEW</h1>
<input type="text" id="loginPhone" placeholder="Phone: 07XXXXXXXX">
<input type="password" id="loginPin" placeholder="4 Digit PIN">
<button onclick="login()">Login</button>
</div>

<div id="app" style="display:none">
<h1>Welcome to NEXA VIEW</h1>
<div id="packages"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "PASTE_YOUR_APIKEY",
  authDomain: "PASTE_YOUR_AUTHDOMAIN", 
  databaseURL: "PASTE_YOUR_DATABASEURL",
  projectId: "PASTE_YOUR_PROJECTID",
  storageBucket: "PASTE_YOUR_STORAGEBUCKET",
  messagingSenderId: "PASTE_YOUR_MESSAGINGSENDERID",
  appId: "PASTE_YOUR_APPID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.createAccount = function() {
  const phone = document.getElementById('phone').value;
  const username = document.getElementById('username').value;
  const pin = document.getElementById('pin').value;
  
  if(!phone || !username || pin.length != 4){ alert("Fill all fields correctly"); return; }
  
  set(ref(db, 'users/' + phone), {
    username: username,
    phone: phone,
    pin: pin,
    balance: 0,
    package: null,
    adsWatched: 0,
    lastAd: 0
  }).then(()=>{
    alert("Account Created!");
    showApp();
  });
}

window.login = function() {
  const phone = document.getElementById('loginPhone').value;
  const pin = document.getElementById('loginPin').value;
  
  get(child(ref(db), `users/${phone}`)).then((snapshot)=>{
    if(snapshot.exists() && snapshot.val().pin == pin){
      showApp();
    } else { alert("Wrong phone or PIN"); }
  });
}

function showApp(){
  document.getElementById('signup').style.display='none';
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  loadPackages();
}

function loadPackages(){
  document.getElementById('packages').innerHTML = "<h2>Packages Coming Soon...</h2>";
}

function showLogin(){
  document.getElementById('signup').style.display='none';
  document.getElementById('login').style.display='block';
}
</script>
</body>
</html>
