<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA VIEW</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Poppins;margin:0;padding:0 0 80px 0} /* 80px padding for nav */
.top-bar{text-align:center;padding:20px 15px;background:#000}
.top-bar p{margin:0;font-size:13px;color:#aaa}
.top-bar h1{margin:8px 0;font-size:28px;color:#22c55e;font-weight:700}

.box{margin:15px;padding:14px;border-radius:14px;background:#111;border:1px solid #222}

.wallet-card{background:#181818;border-radius:14px;padding:14px;margin:15px;border:1px solid #333}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #222;font-size:13px}
.stat-row:last-child{border:none}
.stat-row b{color:#22c55e;font-size:13px}
.stat-row.green{color:#22c55e}
.stat-row.yellow{color:#fbbf24}

h3{display:flex;align-items:center;gap:8px;color:white;margin:0 0 12px 0;font-size:16px;font-weight:700}

.package-card{
  background:linear-gradient(135deg,#1a1a1a,#222);
  border:1px solid #333;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  cursor:pointer;
  transition:0.2s;
}
.package-card:active{transform:scale(0.98);border-color:#fbbf24}

.btn-wrap{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:11px;background:linear-gradient(180deg,#fbbf24,#f59e0b);color:black;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px}
.btn-green{background:linear-gradient(180deg,#22c55e,#16a34a);color:white}
.btn-orange{background:linear-gradient(180deg,#f97316,#ea580c);color:white}

input{width:100%;padding:10px;background:#1a1a1a;border:1px solid #333;color:white;border-radius:8px;margin:6px 0;font-size:13px}
label{font-size:11px;color:#aaa;margin-bottom:4px;display:block;font-weight:600}
.note{font-size:9px;color:#f59e0b;margin-top:6px;font-style:italic;line-height:1.3}

.team-card{background:#181818;border:1px solid #222;border-radius:12px;padding:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.team-info b{display:block;font-size:13px}
.level-badge{font-size:9px;padding:3px 7px;border-radius:20px;background:#fbbf24;color:#000;font-weight:700}
.active-badge{font-size:9px;padding:3px 7px;border-radius:20px;background:#22c55e20;color:#22c55e;font-weight:700;margin-left:5px}
.history-card{background:#181818;border:1px solid #222;border-radius:12px;padding:10px;margin-bottom:10px}
.history-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.history-amount{font-size:14px;font-weight:700}
.history-status{font-size:9px;padding:3px 8px;border-radius:20px;font-weight:700}
.status-pending{background:#f59e0b20;color:#f59e0b}
.status-completed{background:#22c55e20;color:#22c55e}
.gray{color:#888}
.deposit-box{background:#1a3d2a;border:1px solid #22c55e;border-radius:14px;padding:14px;margin-bottom:15px}
.mpesa-number{font-size:18px;color:#22c55e;font-weight:700;text-align:center;padding:8px;background:#000;border-radius:8px;margin:10px 0}
.copy-btn{padding:5px 10px;background:#22c55e;color:#000;border:none;border-radius:6px;font-size:10px;cursor:pointer;font-weight:700}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modal-back{font-size:28px;cursor:pointer;color:#aaa;font-weight:700;background:#222;padding:6px 12px;border-radius:10px;line-height:1}
.green-banner{background:linear-gradient(90deg,#059669,#047857);padding:10px;border-radius:12px;margin-bottom:15px;font-size:11px}
.amount-btns{display:flex;gap:6px;margin-bottom:15px;flex-wrap:wrap}
.amount-btn{padding:7px 12px;background:#2a2a2a;border:1px solid #444;border-radius:20px;cursor:pointer;font-weight:600;font-size:12px;min-width:60px}
.amount-btn.active{background:#fbbf24;color:#000}
.calc-row{display:flex;gap:8px;margin-bottom:15px}
.calc-box{flex:1;background:#1a1a1a;padding:8px;border-radius:8px;font-size:11px}
.calc-box b{color:#fbbf24}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;justify-content:center;align-items:center;overflow-y:auto}
.modal-content{background:#111;width:90%;max-height:90%;overflow-y:auto;border-radius:16px;padding:18px;border:1px solid #333}

/* FIXED BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#111;
  border-top:1px solid #333;
  display:flex;
  justify-content:space-around;
  padding:10px 0 15px 0;
  z-index:9999; /* MAKE SURE IT'S ON TOP */
}
.nav-item{
  flex:1;
  text-align:center;
  font-size:11px;
  color:#888;
  cursor:pointer;
}
.nav-item.active{color:#fbbf24;font-weight:700}
.nav-item svg{
  width:26px;  /* BIGGER ICONS */
  height:26px;
  margin-bottom:4px;
  display:block;
  margin-left:auto;
  margin-right:auto;
}
</style>
</head>
<body>

<!-- ALL YOUR TABS SAME AS BEFORE -->
<div id="homeTab">
  <div class="top-bar"><p>Account Balance</p><h1>Ksh <span id="balance">0.00</span></h1></div>
  <div class="box">
    <h3>📦 Buy Package</h3>
    <p style="font-size:12px;color:#aaa;margin-bottom:15px">purchase a product and earn interest daily</p>
    <!-- ALL 8 PACKAGE CARDS HERE... SAME AS BEFORE -->
  </div>
</div>

<div id="tasksTab" style="display:none"><div class="box"><h3>✅ Daily Tasks</h3><p class="gray">No active package</p></div></div>
<div id="walletTab" style="display:none"><!-- WALLET CONTENT SAME --></div>
<div id="infoTab" style="display:none"><!-- INFO CONTENT SAME --></div>

<!-- MODALS SAME AS BEFORE -->

<!-- FIXED BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="showTab('home')">
    <svg fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
    Home
  </div>
  <div class="nav-item" onclick="showTab('tasks')">
    <svg fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2h8a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h6a1 1 0 100-2H7z"/></svg>
    Tasks
  </div>
  <div class="nav-item" onclick="showTab('wallet')">
    <svg fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4z"/></svg>
    Wallet
  </div>
  <div class="nav-item" onclick="showTab('info')">
    <svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"/></svg>
    Info
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const phone = localStorage.getItem("nexaPhone");
if(!phone){ window.location.href = "index.html"; }

function showTab(tab){
  document.querySelectorAll('.nav-item').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.nav-item[onclick="showTab('${tab}')"]`).classList.add('active');
  ['home','tasks','wallet','info'].forEach(t=>document.getElementById(t+'Tab').style.display='none');
  document.getElementById(tab+'Tab').style.display = 'block';
  if(tab == 'wallet'){ loadIncomeStats(); }
}

// PASTE ALL YOUR OTHER JS FUNCTIONS HERE: loadUser, buyPackage, modals, etc
// ... keep all the functions from previous code

function loadUser(){db.collection("users").doc(phone).get().then(doc=>{if(doc.exists){document.getElementById('balance').innerText = doc.data().balance.toFixed(2);}})}
loadUser();
</script>
</body>
</html>
