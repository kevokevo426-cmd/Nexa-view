<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA VIEW</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  body { font-family: 'Poppins', sans-serif; background:#000; color:white; margin:0; padding-bottom:80px; text-align:center; }
  .card { background:#111; padding:20px; border-radius:16px; margin:20px; border:1px solid #222; text-align:left; }
  .logo { width:80px; height:80px; background:#fbbf24; color:black; border-radius:20px; margin:20px auto; font-size:40px; font-weight:bold; display:flex; align-items:center; justify-content:center; }
  h1 { color:#fbbf24; margin:0; }
  h2 { color:white; margin-top:0; }
  input { width:100%; padding:14px; margin:8px 0; border-radius:10px; background:#222; border:1px solid #333; color:white; box-sizing:border-box; font-size:16px; }
  .phone-box { display:flex; gap:10px; }
  .phone-box span { padding:14px; background:#222; border-radius:10px; border:1px solid #333; color:#888; }
  .btn { width:100%; padding:14px; background:linear-gradient(90deg,#fbbf24,#f59e0b); color:black; border:none; border-radius:10px; font-weight:bold; font-size:16px; margin-top:10px; cursor:pointer; }
  .btn:disabled { background:#444; color:#888; cursor:not-allowed; }
  .captcha-box { display:flex; gap:10px; align-items:center; }
  .captcha { background:#222; padding:14px; border-radius:10px; font-size:22px; letter-spacing:5px; color:#fbbf24; font-weight:bold; cursor:pointer; user-select:none; }
  #loginPage { padding:20px; }
  label { font-size:13px; color:#888; display:block; margin-top:10px; }
  a { color:#fbbf24; text-decoration:none; }
  .terms { display:flex; align-items:center; gap:10px; margin:15px 0; font-size:13px; }
  .terms input { width:20px; height:20px; margin:0; }
  #authMsg { text-align:center; font-size:14px; margin-top:10px; }
</style>
</head>
<body>

<div id="loginPage">
  <div class="logo">N</div>
  <h1>NEXA VIEW</h1>
  <p style="color:#888;">Start Your Earning Journey</p>

  <div class="card">
    <h2>Create Account</h2>
    <p style="color:#888; font-size:13px;">Fill in your details to get started</p>

    <label>PHONE NUMBER</label>
    <div class="phone-box">
      <span>+254</span>
      <input type="tel" id="phone" placeholder="712 345 678" maxlength="9" inputmode="numeric">
    </div>

    <label>PASSWORD</label>
    <input type="password" id="password" placeholder="Min 4 digits" inputmode="numeric">

    <label>VERIFICATION CODE</label>
    <div class="captcha-box">
      <input type="text" id="captchaInput" placeholder="Enter code above" inputmode="numeric">
      <div class="captcha" id="captchaCode" onclick="generateCaptcha()" title="Click to refresh">2254</div>
    </div>

    <label>INVITATION CODE <span style="color:#666;">Optional</span></label>
    <input type="text" id="invite" placeholder="Enter invite code">

    <div class="terms">
      <input type="checkbox" id="agreeTerms">
      <label for="agreeTerms">I agree to the <a href="terms.html" target="_blank">Terms</a> & <a href="privacy.html" target="_blank">Privacy Policy</a></label>
    </div>

    <button class="btn" id="regBtn" onclick="register()">REGISTER</button>
    <p id="authMsg"></p>
    <p style="text-align:center;">Already have account? <a onclick="login()">Login</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",
  authDomain: "nexa-view.firebaseapp.com",
  projectId: "nexa-view",
  storageBucket: "nexa-view.firebasestorage.app",
  messagingSenderId: "947915083946",
  appId: "1:947915083946:web:7f2cb69ddbc2f8bd2ec0d3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// GET ELEMENTS
const phone = document.getElementById('phone');
const password = document.getElementById('password');
const captchaInput = document.getElementById('captchaInput');
const captchaCode = document.getElementById('captchaCode');
const invite = document.getElementById('invite');
const agreeTerms = document.getElementById('agreeTerms');
const regBtn = document.getElementById('regBtn');
const authMsg = document.getElementById('authMsg');

// 1. AUTO FILL INVITE FROM LINK ?ref=CODE
const urlParams = new URLSearchParams(window.location.search);
const refCode = urlParams.get('ref');
if(refCode){
  invite.value = refCode;
  invite.readOnly = true;
  invite.style.background = "#1a1a1a";
}

// 2. GENERATE CAPTCHA
function generateCaptcha(){
  let code = Math.floor(1000 + Math.random() * 9000);
  captchaCode.innerText = code;
}
generateCaptcha();

// 3. DISABLE BUTTON UNTIL TERMS CHECKED
agreeTerms.onchange = function(){
  regBtn.disabled = !this.checked;
}
regBtn.disabled = true;

function register() {
  let fullPhone = "254" + phone.value.replace(/\s/g, '');
  let pass = password.value;
  let capInput = captchaInput.value;
  let capReal = captchaCode.innerText;

  // VALIDATIONS
  if(capInput !== capReal) {
    authMsg.style.color = "#ef4444";
    authMsg.innerText = "❌ Wrong verification code";
    generateCaptcha();
    return;
  }
  if(fullPhone.length !== 12) {
    authMsg.style.color = "#ef4444";
    authMsg.innerText = "❌ Enter valid 9 digit phone number";
    return;
  }
  if(pass.length < 4) {
    authMsg.style.color = "#ef4444";
    authMsg.innerText = "❌ Password must be atleast 4 digits";
    return;
  }

  authMsg.style.color = "#fbbf24";
  authMsg.innerText = "Creating account...";

  // CHECK IF PHONE EXISTS
  db.collection("users").doc(fullPhone).get().then(doc => {
    if(doc.exists){
      authMsg.style.color = "#ef4444";
      authMsg.innerText = "❌ This phone number already registered";
    } else {
      db.collection("users").doc(fullPhone).set({
        phone: fullPhone, 
        password: pass, 
        balance: 0, 
        package: "None", 
        invitedBy: invite.value || "None",
        agreedToTerms: true,
        createdAt: new Date()
      }).then(() => {
        authMsg.style.color = "#22c55e";
        authMsg.innerText = "✅ Account Created! You can login now.";
        phone.value = ""; password.value = ""; captchaInput.value = ""; agreeTerms.checked = false; regBtn.disabled = true;
        generateCaptcha();
      }).catch(e => {
        authMsg.style.color = "#ef4444";
        authMsg.innerText = "Error: " + e.message;
      });
    }
  });
}

function login(){
  alert("Login page coming in v3.4 boss. For now just register.")
}
</script>
</body>
</html>
