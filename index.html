<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA LOGIN</title>
<style>
body{background:#000;color:white;font-family:Poppins;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#111;padding:30px;border-radius:16px;border:1px solid #fbbf24;width:90%;max-width:400px;text-align:center} /* added text-align */
.logo{width:80px;height:80px;margin:0 auto 15px auto;display:block} /* NEW LOGO STYLE */
input,button{width:100%;padding:14px;margin:10px 0;background:#222;border:1px solid #333;color:white;border-radius:10px;font-size:15px;box-sizing:border-box}
button{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:black;font-weight:bold;cursor:pointer}
h2{color:#fbbf24;text-align:center;margin:0 0 10px 0} /* adjusted margin */
a{color:#fbbf24}
</style>
</head>
<body>
<div class="box">
  <!-- ADDED LOGO -->
  <img src="nexa_view_icon.webp" alt="NEXA VIEW" class="logo">
  
  <h2>NEXA LOGIN</h2>
  <input type="tel" id="phone" placeholder="Phone: 0712345678">
  <input type="password" id="pass" placeholder="Password">
  <button onclick="login()">LOGIN</button>
  <p style="text-align:center">No account? <a href="register.html">Register here</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// AUTO CONVERT 07 to 254
function formatPhone(p){
  p = p.replace(/\D/g,'');
  if(p.startsWith('0')) return '254' + p.substring(1);
  if(p.startsWith('7')) return '254' + p;
  return p;
}

function login(){
  let phone = formatPhone(document.getElementById('phone').value.trim());
  let pass = document.getElementById('pass').value.trim();
  if(!phone || !pass){ alert('Fill all'); return; }
  
  db.collection("users").doc(phone).get().then(doc=>{
    if(!doc.exists){ alert('❌ Account not found'); return; }
    if(doc.data().password !== pass){ alert('❌ Wrong Password'); return; }
    localStorage.setItem("nexaPhone", phone);
    window.location.href = "dashboard.html";
  });
}
</script>
</body>
</html>
