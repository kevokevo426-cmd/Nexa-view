<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA VIEW - Login</title>
<style>
    body { background: #000; color: #fff; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: #111; padding: 30px; border-radius: 15px; border: 2px solid #FFD700; width: 90%; max-width: 400px; text-align: center; }
    .login-box h1 { color: #FFD700; margin-bottom: 10px; }
    .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #FFD700; border-radius: 8px; color: #fff; outline: none; }
    .login-box button { width: 100%; padding: 12px; background: #FFD700; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size:16px }
    .login-box button:hover{background:#ffc800}
</style>
</head>
<body>
    <div class="login-box">
        <h1>NEXA VIEW</h1>
        <p>Welcome Back</p>
        <input type="text" placeholder="Phone Number" id="phone">
        <input type="password" placeholder="Password" id="pass">
        <button onclick="login()">LOGIN</button>
        <p style="font-size:14px; margin-top:15px;">Don't have an account? <a href="/register.html" style="color:#FFD700;text-decoration:underline;font-weight:bold">Register</a></p>
    </div>

<script>
function login() {
    let phone = document.getElementById('phone').value;
    let pass = document.getElementById('pass').value;
    if(phone && pass) {
        localStorage.setItem('userPhone', phone);
        window.location.href = '/index.html'; // goes to your dashboard
    } else {
        alert('Please enter phone number and password')
    }
}
</script>
</body>
</html>
