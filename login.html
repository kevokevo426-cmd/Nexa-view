<!DOCTYPE html>
<html>
<head><title>NEXA Login</title>
<style>
body{background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif}
.box{background:#111;padding:30px;border-radius:15px;border:1px solid #FFD700}
input,button{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none}
button{background:#FFD700;color:#000;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h2 style="color:#FFD700;text-align:center">NEXA LOGIN</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="localStorage.setItem('nexaUser',u.value);location='dashboard.html'">Login</button>
</div>
</body>
</html>
