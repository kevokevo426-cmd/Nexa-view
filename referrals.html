<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA REFERRALS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Poppins;margin:0;padding:15px 15px 80px 15px}
.box{margin:15px 0;padding:14px;border-radius:14px;background:#111;border:1px solid #222}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #222;font-size:13px}
.stat-row:last-child{border:none}
.stat-row b{color:#22c55e;font-size:13px}
.stat-row.yellow{color:#fbbf24}
h3{display:flex;align-items:center;gap:8px;color:white;margin:0 0 12px 0;font-size:16px;font-weight:700}
.btn-wrap{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:11px;background:linear-gradient(180deg,#fbbf24,#f59e0b);color:black;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px}
.btn:active{transform:scale(0.97)}
.btn-green{background:linear-gradient(180deg,#22c55e,#16a34a);color:white}
.btn-orange{background:linear-gradient(180deg,#f97316,#ea580c);color:white}
input{width:100%;padding:10px;background:#1a1a1a;border:1px solid #333;color:white;border-radius:8px;margin:6px 0;font-size:13px}
label{font-size:11px;color:#aaa;margin-bottom:4px;display:block;font-weight:600}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0 15px 0;z-index:99}
.nav-item{flex:1;text-align:center;font-size:11px;color:#666;cursor:pointer;text-decoration:none;transition:0.3s}
.nav-item svg{width:24px;height:24px;margin-bottom:4px;display:block;margin:0 auto 4px auto;transition:0.3s}
.nav-item.active{transform:translateY(-3px) scale(1.1);font-weight:800}
.nav-item.active:nth-child(1){color:#fbbf24}.nav-item.active:nth-child(1) svg{filter:drop-shadow(0 0 10px #fbbf24);fill:#fbbf24}
.nav-item:nth-child(2).active{color:#22c55e}.nav-item:nth-child(2).active svg{filter:drop-shadow(0 0 10px #22c55e);fill:#22c55e}
.nav-item:nth-child(3).active{color:#3b82f6}.nav-item:nth-child(3).active svg{filter:drop-shadow(0 0 10px #3b82f6);fill:#3b82f6}
.nav-item:nth-child(4).active{color:#f97316}.nav-item:nth-child(4).active svg{filter:drop-shadow(0 0 10px #f97316);fill:#f97316}
.badge-active{background:#052e16;color:#22c55e;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700}
.badge-inactive{background:#422006;color:#fbbf24;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700}
#toastBox{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;width:90%;max-width:350px}
.toast{background:#111;border:1px solid #22c55e;color:white;padding:12px;border-radius:12px;font-size:12px;margin-bottom:8px;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
</style>
</head>
<body>
<div id="toastBox"></div>
<h2>🎁 MY TEAM</h2>

<div class="box">
  <div class="stat-row"><span>Referral Income Total</span><b class="yellow">Ksh <span id="refIncome">0.00</span></b></div>
  <div class="stat-row"><span>LV1 Direct</span><b id="lv1Count">0</b></div>
  <div class="stat-row"><span>LV2 Team</span><b id="lv2Count">0</b></div>
</div>

<div class="box">
  <h3>🎁 Referral & Earn 10%</h3>
  <p style="font-size:12px;color:#22c55e;margin-bottom:10px">Earn 10% LV1 + 5% LV2 when they buy product</p>
  <label>Your Referral Code</label>
  <input id="myCode" readonly>
  <label>Your Referral Link</label>
  <input id="myLink" readonly>
  <div class="btn-wrap">
    <button class="btn btn-green" onclick="copyLink()">📋 Copy</button>
    <button class="btn btn-orange" onclick="shareLink()">🔗 Share</button>
  </div>
</div>

<div class="box">
  <h3>📜 Referral History <span style="font-size:11px;color:#fbbf24">(<span id="teamCount">0</span> Members)</span></h3>
  <div id="refHistory"><p style="color:#888">Loading...</p></div>
</div>

<button class="btn" onclick="window.location.href='dashboard.html'" style="width:100%;background:#333;margin-top:10px">← BACK TO DASHBOARD</button>

<div class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
  <a href="tasks.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>Tasks</a>
  <a href="wallet.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2.9 2 2v1h-9c-1.11 0-2.9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>Wallet</a>
  <a href="referrals.html" class="nav-item active"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Team</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const phone = localStorage.getItem("nexaPhone");
if(!phone){ window.location.href = "index.html"; }

function showToast(msg){
  const box=document.getElementById('toastBox');
  const t=document.createElement('div');
  t.className='toast'; t.innerText="✅ "+msg;
  box.appendChild(t); setTimeout(()=>t.remove(),3500);
}

function loadReferralInfo(){
  db.collection("users").doc(phone).onSnapshot(doc=>{
    if(!doc.exists) return;
    let u = doc.data();
    let myCode = u.myReferralCode || u.userId || phone.substring(3,9);
    // FIXED: VERCEL LINK - NO MORE 404!
    let myLink = `https://nexa-view.vercel.app/register.html?ref=${myCode}`;

    document.getElementById('myCode').value = myCode;
    document.getElementById('myLink').value = myLink;
    document.getElementById('refIncome').innerText = (u.totalReferralEarned || 0).toFixed(2);

    let lv1Phones = u.myReferralsLV1 || u.referrals || [];
    let lv2Phones = u.myReferralsLV2 || [];
    
    document.getElementById('lv1Count').innerText = lv1Phones.length;
    document.getElementById('lv2Count').innerText = lv2Phones.length;
    document.getElementById('teamCount').innerText = lv1Phones.length + lv2Phones.length;

    let html = "";
    if(lv1Phones.length==0 && lv2Phones.length==0){
      html = "<p style='color:#888'>No team members yet - Share your link!</p>";
      document.getElementById('refHistory').innerHTML = html;
      return;
    }

    html += `<p style="font-size:12px;color:#fbbf24;font-weight:700;margin:10px 0 6px">👤 LV1 - Direct (10% Bonus)</p>`;
    if(lv1Phones.length==0){
      html += `<p style='color:#555;font-size:11px'>No LV1 yet</p>`;
    }
    html += `<div id="lv1Container"></div>`;
    html += `<p style="font-size:12px;color:#22c55e;font-weight:700;margin:15px 0 6px">👥👥 LV2 - Team of LV1 (5% Bonus)</p><div id="lv2Container"></div>`;
    document.getElementById('refHistory').innerHTML = html;

    setTimeout(()=>{
      if(lv1Phones.length>0){
        document.getElementById('lv1Container').innerHTML="";
        lv1Phones.forEach(p=>{
          db.collection("users").doc(p).get().then(snap=>{
            let user = snap.exists ? snap.data() : null;
            if(!user){
              db.collection("users").where("userId","==",p).get().then(s2=>{
                s2.forEach(d=>appendRef(d.data(), "lv1Container", "LV1"));
              });
              return;
            }
            appendRef(user, "lv1Container", "LV1");
          });
        });
      }
      if(lv2Phones.length>0){
        document.getElementById('lv2Container').innerHTML="";
        lv2Phones.forEach(p=>{
          db.collection("users").doc(p).get().then(snap=>{
            let user = snap.exists ? snap.data() : null;
            if(!user) return;
            appendRef(user, "lv2Container", "LV2");
          });
        });
      } else {
        if(document.getElementById('lv2Container')) document.getElementById('lv2Container').innerHTML="<p style='color:#555;font-size:11px'>No LV2 yet - When LV1 invites, they become your LV2</p>";
      }
    },300);
  });
}

function appendRef(user, containerId, level){
  let el=document.getElementById(containerId);
  if(!el) return;
  let isActive = user.hasPurchased || user.isActive;
  let statusBadge = isActive ? `<span class="badge-active">ACTIVE</span>` : `<span class="badge-inactive">INACTIVE</span>`;
  let statusText = isActive ? "Bought Product" : "No purchase yet";
  el.innerHTML += `<div style="background:#1a1a1a;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;border:1px solid #222">
    <div><b style="font-size:13px">${user.userId||'N/A'}</b><br><span style="font-size:11px;color:#aaa">${user.phone||''}</span><br><span style="font-size:10px;color:#666">${level} - ${statusText}</span></div>
    <div>${statusBadge}</div>
  </div>`;
}

function copyLink(){ 
  let link = document.getElementById('myLink').value; 
  navigator.clipboard.writeText(link).then(()=>showToast("Vercel Link Copied! "+link));
}

function shareLink(){
  let link = document.getElementById('myLink').value;
  let code = document.getElementById('myCode').value;
  let text = `🔥 Join NEXA VIEW and Earn Daily!\n\nUse my code: ${code}\nRegister: ${link}\n\nEarn 10% LV1 + 5% LV2!`;
  let whatsappUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(whatsappUrl, '_blank');
}

window.onload = loadReferralInfo;
</script>
</body>
</html>
