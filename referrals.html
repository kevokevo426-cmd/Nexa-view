<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA REFERRALS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#fff8ec;color:#222;font-family:Poppins;margin:0;padding:0 0 85px 0}
.top-stats{background:#111;margin:0;padding:16px 15px;border-radius:0 0 18px 18px}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:13px;color:#aaa}
.stat-row:last-child{border:none}
.stat-row b{color:#22c55e}
.stat-row.total b{color:#fbbf24;font-size:15px}
.tab-bar{display:flex;background:#f5e8cc;margin:0;overflow:hidden;position:sticky;top:0;z-index:10}
.tab{flex:1;text-align:center;padding:14px 0;font-weight:700;font-size:14px;cursor:pointer;color:#888;border-bottom:3px solid transparent}
.tab.active{color:#d97706;border-bottom:3px solid #d97706;background:#fff3d6}
.level-list{background:#fff8ec;min-height:300px}
.level-list.hidden{display:none}
.member-row{display:flex;align-items:center;gap:12px;padding:14px 12px;border-bottom:1px solid #f0d9a8;background:white}
.avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid #fbbf24;flex-shrink:0;background:#111}
.info{flex:1;line-height:1.3}
.info b{font-size:14px;color:#111;display:block}
.sub{font-size:11px;color:#666}
.sub2{font-size:11px;color:#999}
.sub3{font-size:12px;color:#111;font-weight:600;margin-top:2px}
.status{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;background:#eee;color:#888;flex-shrink:0}
.status.active{background:#dcfce7;color:#16a34a}
.arrow{color:#aaa;font-size:18px}
.box2{margin:12px;background:#111;padding:14px;border-radius:16px;border:1px solid #222}
.box2 label{font-size:11px;color:#aaa;margin-bottom:4px;display:block}
.box2 input{width:100%;padding:11px;background:#1a1a1a;border:1px solid #333;color:white;border-radius:8px;margin:6px 0;font-size:13px}
.btn-wrap{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px}
.btn-green{background:linear-gradient(180deg,#22c55e,#16a34a);color:white}
.btn-orange{background:linear-gradient(180deg,#fbbf24,#f59e0b);color:black}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 12px 0;z-index:99}
.nav-item{flex:1;text-align:center;font-size:11px;color:#666;text-decoration:none;transition:0.2s}
.nav-item svg{width:24px;height:24px;display:block;margin:0 auto 3px auto;fill:currentColor}
.nav-item.active{color:#fbbf24;font-weight:800;transform:translateY(-2px)}
.nav-item.active svg{filter:drop-shadow(0 0 8px #fbbf24)}
#toastBox{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;width:90%;max-width:350px}
.toast{background:#111;border:1px solid #22c55e;color:white;padding:12px;border-radius:12px;font-size:12px}
</style>
</head>
<body>
<div id="toastBox"></div>

<div class="top-stats">
  <div style="text-align:center;color:#fbbf24;font-weight:800;margin-bottom:8px">🎁 MY TEAM EARNINGS</div>
  <div class="stat-row total"><span>Total Gained</span><b>Ksh <span id="totalGained">0.00</span></b></div>
  <div class="stat-row"><span>Gained from L1 (10%)</span><b>Ksh <span id="gainedL1">0.00</span></b></div>
  <div class="stat-row"><span>Gained from L2 (5%)</span><b>Ksh <span id="gainedL2">0.00</span></b></div>
</div>

<div class="box2">
  <label>Your Code</label><input id="myCode" readonly>
  <label>Your Link</label><input id="myLink" readonly>
  <div class="btn-wrap"><button class="btn btn-green" onclick="copyLink()">📋 Copy</button><button class="btn btn-orange" onclick="shareLink()">🔗 Share</button></div>
</div>

<div class="tab-bar" id="tabBar">
  <div class="tab active" data-level="1" onclick="switchTab(1)">Level 1 (<span id="lv1CountTab">0</span>)</div>
  <div class="tab" data-level="2" onclick="switchTab(2)">Level 2 (<span id="lv2CountTab">0</span>)</div>
</div>

<div id="swipeArea">
  <div id="level1List" class="level-list"></div>
  <div id="level2List" class="level-list hidden"></div>
</div>

<!-- BOTTOM NAV WITH ICONS RESTORED -->
<div class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
  <a href="tasks.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>Tasks</a>
  <a href="wallet.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2.9 2 2v1h-9c-1.11 0-2.9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>Wallet</a>
  <a href="referrals.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Team</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const phone = localStorage.getItem("nexaPhone");
if(!phone) window.location.href="index.html";

function showToast(m){let b=document.getElementById('toastBox');let t=document.createElement('div');t.className='toast';t.innerText="✅ "+m;b.appendChild(t);setTimeout(()=>t.remove(),3000);}
let currentTab=1;
function switchTab(n){
  currentTab=n;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tab[data-level="${n}"]`).classList.add('active');
  document.getElementById('level1List').classList.toggle('hidden', n!=1);
  document.getElementById('level2List').classList.toggle('hidden', n!=2);
}
let startX=0;
let area=document.getElementById('swipeArea');
area.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;},{passive:true});
area.addEventListener('touchend',e=>{
  let diff=e.changedTouches[0].clientX-startX;
  if(Math.abs(diff)>80){
    if(diff<0 && currentTab==1) switchTab(2);
    else if(diff>0 && currentTab==2) switchTab(1);
  }
});
function formatDate(ts){
  if(!ts) return 'Unknown';
  try{let d=ts.toDate?ts.toDate():new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();}catch(e){return 'Unknown';}
}
function loadReferrals(){
  db.collection("users").doc(phone).onSnapshot(doc=>{
    if(!doc.exists) return;
    let u=doc.data();
    let myCode=u.myReferralCode||u.userId;
    document.getElementById('myCode').value=myCode;
    document.getElementById('myLink').value=`https://nexa-view.vercel.app/register.html?ref=${myCode}`;
    document.getElementById('totalGained').innerText=(u.totalReferralEarned||0).toFixed(2);
    document.getElementById('gainedL1').innerText=(u.totalReferralEarnedL1||u.referralEarnL1||0).toFixed(2);
    document.getElementById('gainedL2').innerText=(u.totalReferralEarnedL2||u.referralEarnL2||0).toFixed(2);
    let lv1Phones=u.myReferralsLV1||u.referrals||[];
    let lv2Phones=u.myReferralsLV2||[];
    document.getElementById('lv1CountTab').innerText=lv1Phones.length;
    document.getElementById('lv2CountTab').innerText=lv2Phones.length;
    document.getElementById('level1List').innerHTML= lv1Phones.length==0?'<p style="padding:20px;color:#888;text-align:center">No Level 1 yet</p>':'';
    document.getElementById('level2List').innerHTML= lv2Phones.length==0?'<p style="padding:20px;color:#888;text-align:center">No Level 2 yet</p>':'';

    lv1Phones.forEach((lv1Phone, idx)=>{
      db.collection("users").doc(lv1Phone).get().then(snap=>{
        if(!snap.exists) return;
        let data=snap.data();
        let phoneDisplay=data.phone||lv1Phone;
        let id=data.userId||data.myReferralCode||'N/A';
        let joined=formatDate(data.date);
        let pkg = data.ownedPackagesList && data.ownedPackagesList.length>0? data.ownedPackagesList[0] : (data.hasPurchased?'Active':'No Package');
        // REFERRALS COUNT INSTEAD OF WITHDRAWALS
        let refCount = (data.myReferralsLV1||data.referrals||[]).length + (data.myReferralsLV2||[]).length;
        let isActive=data.hasPurchased||data.isActive;
        let row=document.createElement('div');
        row.className='member-row';
        row.innerHTML=`
          <img src="nexa_view_icon.webp" class="avatar" onerror="this.src='https://via.placeholder.com/50/fbbf24/000?text=N'">
          <div class="info">
            <b>${idx+1}. ${phoneDisplay}</b>
            <span class="sub">ID ${id} · @${phoneDisplay.slice(-6)}</span>
            <span class="sub2">Joined ${joined}</span>
            <span class="sub3">Package: ${pkg} · Referrals: ${refCount}</span>
          </div>
          <span class="status ${isActive?'active':''}">${isActive?'Active':'Inactive'}</span>
          <span class="arrow">›</span>
        `;
        document.getElementById('level1List').appendChild(row);
      });
    });

    lv2Phones.forEach((lv2Phone, idx)=>{
      db.collection("users").doc(lv2Phone).get().then(snap=>{
        if(!snap.exists) return;
        let data=snap.data();
        let phoneDisplay=data.phone||lv2Phone;
        let id=data.userId||data.myReferralCode||'N/A';
        let joined=formatDate(data.date);
        let pkg = data.ownedPackagesList && data.ownedPackagesList.length>0? data.ownedPackagesList[0] : (data.hasPurchased?'Active':'No Package');
        let refCount = (data.myReferralsLV1||data.referrals||[]).length + (data.myReferralsLV2||[]).length;
        let isActive=data.hasPurchased||data.isActive;
        let row=document.createElement('div');
        row.className='member-row';
        row.innerHTML=`
          <img src="nexa_view_icon.webp" class="avatar">
          <div class="info">
            <b>${idx+1}. ${phoneDisplay}</b>
            <span class="sub">ID ${id} · @${phoneDisplay.slice(-6)}</span>
            <span class="sub2">Joined ${joined}</span>
            <span class="sub3">Package: ${pkg} · Referrals: ${refCount}</span>
          </div>
          <span class="status ${isActive?'active':''}">${isActive?'Active':'Inactive'}</span>
          <span class="arrow">›</span>
        `;
        document.getElementById('level2List').appendChild(row);
      });
    });
  });
}
function copyLink(){navigator.clipboard.writeText(document.getElementById('myLink').value).then(()=>showToast("Link Copied!"));}
function shareLink(){let l=document.getElementById('myLink').value;let c=document.getElementById('myCode').value;window.open(`https://wa.me/?text=${encodeURIComponent(`Join NEXA VIEW! Code:${c} Link:${l}`)}`,'_blank');}
window.onload=loadReferrals;
</script>
</body>
</html>
