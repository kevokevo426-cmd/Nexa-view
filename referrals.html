<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA REFERRALS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Poppins;margin:0;padding:15px 15px 80px 15px}
.box{margin:15px 0;padding:14px;border-radius:14px;background:#111;border:1px solid #222}
.stat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222;font-size:13px}
.stat-row:last-child{border:none}
.stat-row b{color:#22c55e;font-size:14px}
.stat-row.yellow b{color:#fbbf24}
h3{margin:0 0 12px 0;font-size:16px;font-weight:700}
.btn-wrap{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:11px;background:linear-gradient(180deg,#fbbf24,#f59e0b);color:black;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px}
.btn-green{background:linear-gradient(180deg,#22c55e,#16a34a);color:white}
.btn-orange{background:linear-gradient(180deg,#f97316,#ea580c);color:white}
input{width:100%;padding:10px;background:#1a1a1a;border:1px solid #333;color:white;border-radius:8px;margin:6px 0;font-size:13px}
label{font-size:11px;color:#aaa;margin-bottom:4px;display:block;font-weight:600}
.badge-active{background:#052e16;color:#22c55e;padding:2px 6px;border-radius:6px;font-size:9px;font-weight:700}
.badge-inactive{background:#422006;color:#fbbf24;padding:2px 6px;border-radius:6px;font-size:9px;font-weight:700}
#toastBox{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;width:90%;max-width:350px}
.toast{background:#111;border:1px solid #22c55e;color:white;padding:12px;border-radius:12px;font-size:12px}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.team-col{background:#0f0f0f;border:1px solid #222;border-radius:12px;padding:10px;min-height:150px}
.team-col h4{margin:0 0 8px 0;font-size:11px;font-weight:800;text-align:center;padding:6px;border-radius:8px}
.team-col.l1 h4{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid #fbbf24}
.team-col.l2 h4{background:rgba(34,197,94,0.15);color:#22c55e;border:1px solid #22c55e}
.team-card{background:#1a1a1a;padding:8px;border-radius:8px;margin:6px 0;border:1px solid #222;position:relative}
.num{position:absolute;top:4px;left:4px;background:#fbbf24;color:black;font-size:9px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.l2 .num{background:#22c55e;color:white}
.l2-sub{margin:6px 0 0 8px;padding-left:8px;border-left:2px solid #333}
.l2-item{font-size:10px;color:#aaa;margin:3px 0}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0 15px 0;z-index:99}
.nav-item{flex:1;text-align:center;font-size:11px;color:#666;text-decoration:none}
.nav-item.active{color:#f97316;font-weight:800}
</style>
</head>
<body>
<div id="toastBox"></div>
<h2>🎁 MY TEAM</h2>

<div class="box">
  <!-- MONEY NOT POPULATION -->
  <div class="stat-row yellow"><span>💰 Total Gained So Far</span><b>Ksh <span id="totalGained">0.00</span></b></div>
  <div class="stat-row"><span>📈 Gained from L1 (10%)</span><b>Ksh <span id="gainedL1">0.00</span></b></div>
  <div class="stat-row"><span>📈 Gained from L2 (5%)</span><b>Ksh <span id="gainedL2">0.00</span></b></div>
</div>

<div class="box">
  <h3>🎁 Referral & Earn</h3>
  <label>Your Referral Code</label><input id="myCode" readonly>
  <label>Your Referral Link</label><input id="myLink" readonly>
  <div class="btn-wrap"><button class="btn btn-green" onclick="copyLink()">📋 Copy</button><button class="btn btn-orange" onclick="shareLink()">🔗 Share</button></div>
</div>

<div class="box">
  <h3>📜 Referral History (<span id="teamCount">0</span>)</h3>
  <div class="team-grid">
    <div class="team-col l1">
      <h4>LV1 - 10% (<span id="lv1Count">0</span>)</h4>
      <div id="lv1Container"></div>
    </div>
    <div class="team-col l2">
      <h4>LV2 - 5% (<span id="lv2Count">0</span>)</h4>
      <div id="lv2Container"></div>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <a href="dashboard.html" class="nav-item">Home</a>
  <a href="tasks.html" class="nav-item">Tasks</a>
  <a href="wallet.html" class="nav-item">Wallet</a>
  <a href="referrals.html" class="nav-item active">Team</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const phone = localStorage.getItem("nexaPhone");
if(!phone) window.location.href="index.html";

function showToast(m){let b=document.getElementById('toastBox');let t=document.createElement('div');t.className='toast';t.innerText="✅ "+m;b.appendChild(t);setTimeout(()=>t.remove(),3000);}

function loadReferralInfo(){
  db.collection("users").doc(phone).onSnapshot(doc=>{
    if(!doc.exists) return;
    let u=doc.data();
    let myCode=u.myReferralCode||u.userId;
    let myLink=`https://nexa-view.vercel.app/register.html?ref=${myCode}`;
    document.getElementById('myCode').value=myCode;
    document.getElementById('myLink').value=myLink;

    // MONEY - NOT POPULATION
    let total = u.totalReferralEarned || 0;
    let l1Earn = u.totalReferralEarnedL1 || u.referralEarnL1 || 0;
    let l2Earn = u.totalReferralEarnedL2 || u.referralEarnL2 || 0;
    // If L1/L2 breakdown not saved, split by ratio or show total only for L1/L2 = 0
    // For old accounts, we keep total, L1/L2 will be 0 until you save them on purchase
    if(l1Earn==0 && l2Earn==0 && total>0){
      // fallback: show total as total, L1/L2 unknown
      l1Earn = u.referralEarnLV1 || 0;
      l2Earn = u.referralEarnLV2 || 0;
    }

    document.getElementById('totalGained').innerText=total.toFixed(2);
    document.getElementById('gainedL1').innerText=l1Earn.toFixed(2);
    document.getElementById('gainedL2').innerText=l2Earn.toFixed(2);

    let lv1Phones=u.myReferralsLV1||u.referrals||[];
    let lv2Phones=u.myReferralsLV2||[];
    document.getElementById('lv1Count').innerText=lv1Phones.length;
    document.getElementById('lv2Count').innerText=lv2Phones.length;
    document.getElementById('teamCount').innerText=lv1Phones.length+lv2Phones.length;

    document.getElementById('lv1Container').innerHTML="";
    document.getElementById('lv2Container').innerHTML="";

    if(lv1Phones.length==0){
      document.getElementById('lv1Container').innerHTML="<p style='color:#555;font-size:11px;text-align:center'>No LV1</p>";
      document.getElementById('lv2Container').innerHTML="<p style='color:#555;font-size:11px;text-align:center'>No LV2</p>";
      return;
    }

    let lv1Num=0;
    let lv2Num=0;

    lv1Phones.forEach(lv1Phone=>{
      db.collection("users").doc(lv1Phone).get().then(snap=>{
        if(!snap.exists) return;
        let lv1Data=snap.data();
        lv1Num++;
        let phoneDisplay=lv1Data.phone||lv1Phone;
        let isActive=lv1Data.hasPurchased||lv1Data.isActive;
        let badge=isActive?'<span class="badge-active">ACTIVE</span>':'<span class="badge-inactive">INACTIVE</span>';
        let hisL2 = lv1Data.myReferralsLV1||lv1Data.referrals||[];

        let card=document.createElement('div');
        card.className='team-card';
        card.innerHTML=`<div class="num">${lv1Num}</div><div style="margin-left:18px"><b style="font-size:11px">${phoneDisplay}</b><div style="margin-top:2px">${badge}</div><div style="font-size:9px;color:#fbbf24;margin-top:3px">His L2: ${hisL2.length}</div><div class="l2-sub" id="sub-${lv1Phone}"></div></div>`;
        document.getElementById('lv1Container').appendChild(card);

        let subDiv=card.querySelector(`#sub-${CSS.escape(lv1Phone)}`);
        if(hisL2.length==0){subDiv.innerHTML='<span style="font-size:9px;color:#555">No L2</span>';}
        else{
          hisL2.forEach(lv2Phone=>{
            db.collection("users").doc(lv2Phone).get().then(s2=>{
              if(!s2.exists) return;
              let lv2Data=s2.data();
              lv2Num++;
              let lv2PhoneDisplay=lv2Data.phone||lv2Phone;

              // Under LV1
              let item=document.createElement('div');
              item.className='l2-item';
              item.innerHTML=`${lv2Num}. ↳ ${lv2PhoneDisplay}`;
              subDiv.appendChild(item);

              // In LV2 column numbered
              let lv2Card=document.createElement('div');
              lv2Card.className='team-card l2';
              lv2Card.innerHTML=`<div class="num">${lv2Num}</div><div style="margin-left:18px"><b style="font-size:11px">${lv2PhoneDisplay}</b><br><span style="font-size:9px;color:#666">From: ${phoneDisplay}</span></div>`;
              document.getElementById('lv2Container').appendChild(lv2Card);
            });
          });
        }
      });
    });
  });
}

function copyLink(){navigator.clipboard.writeText(document.getElementById('myLink').value).then(()=>showToast("Link Copied!"));}
function shareLink(){let link=document.getElementById('myLink').value;let code=document.getElementById('myCode').value;window.open(`https://wa.me/?text=${encodeURIComponent(`Join NEXA VIEW! Code: ${code} Link: ${link}`)}`,'_blank');}
window.onload=loadReferralInfo;
</script>
</body>
</html>
