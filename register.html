<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA VIEW - Login</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
    body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
    .box{background:#111;padding:30px;border-radius:15px;border:2px solid #FFD700;width:90%;max-width:400px;text-align:center}
    .box h1{color:#FFD700;margin-bottom:10px}
    .box input{width:100%;padding:12px;margin:10px 0;background:#222;border:1px solid #FFD700;border-radius:8px;color:#fff}
    .box button{width:100%;padding:12px;background:#FFD700;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
    .box a{color:#FFD700;text-decoration:none}
</style>
</head>
<body>
    <div class="box">
        <h1>NEXA VIEW</h1>
        <p>Welcome Back</p>
        <input type="text" placeholder="Phone Number" id="phone">
        <input type="password" placeholder="Password" id="pass">
        <button onclick="login()">LOGIN</button>
        <p style="font-size:12px;margin-top:15px;">Don't have account? <a href="register.html">Register</a></p>
    </div>
<script>
function login(){
    let phone = document.getElementById('phone').value;
    let pass = document.getElementById('pass').value;
    if(phone && pass){
        localStorage.setItem('userPhone', phone);
        window.location.href = 'index.html';
    }else{
        alert('Please enter phone and password')
    }
}
</script>
</body>
</html>
