<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA VIEW - Create Account</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
    body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
   .box{background:#1a1a1a;padding:25px;border-radius:20px;width:100%;max-width:420px}
   .box h1{font-size:28px;margin-bottom:20px;font-weight:bold;color:#FFD700}
   .label{font-size:13px;color:#999;margin:15px 0 5px 0}
   .row{display:flex;gap:10px}
    input{background:#2a2a2a;border:1px solid #333;border-radius:12px;color:#fff;padding:14px;width:100%;font-size:15px;outline:none}
   .country{width:90px;text-align:center;background:#2a2a2a;border:1px solid #333;border-radius:12px;padding:14px;color:#999}
   .captcha{display:flex;gap:10px;align-items:center}
   .captcha-box{background:#2a2a2a;border:1px solid #333;border-radius:12px;padding:14px 20px;font-size:22px;font-weight:bold;color:#FFD700;letter-spacing:5px;user-select:none;cursor:pointer}
   .check{display:flex;align-items:center;gap:8px;margin:20px 0;font-size:14px;color:#999}
   .check a{color:#FFD700;text-decoration:none}
   .btn{width:100%;padding:15px;background:#444;color:#888;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
   .btn.active{background:#FFD700;color:#000}
   .footer{text-align:center;margin-top:20px;font-size:15px}
   .footer a{color:#FFD700;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
    <div class="box">
        <h1>Create Account</h1>
        
        <div class="label">PHONE NUMBER</div>
        <div class="row">
            <select class="country" id="countryCode" onchange="genCaptcha()">
                <option value="+254">+254 KE</option>
                <option value="+255">+255 TZ</option>
                <option value="+256">+256 UG</option>
                <option value="+250">+250 RW</option>
            </select>
            <input type="tel" id="phone" placeholder="7XXXXXXXX">
        </div>

        <div class="label">PASSWORD</div>
        <input type="password" id="pass">

        <div class="label">VERIFICATION CODE <span id="regionTag" style="color:#FFD700;font-size:12px"></span></div>
        <div class="captcha">
            <input type="text" id="captchaInput" placeholder="">
            <div class="captcha-box" id="captchaCode" onclick="genCaptcha()">1183</div>
        </div>

        <div class="check">
            <input type="checkbox" id="agree" onchange="checkBtn()">
            <label>I agree to <a href="#">Terms</a></label>
        </div>

        <button class="btn" id="regBtn" onclick="register()">REGISTER</button>

        <div class="footer">Have account? <a href="/login.html">Login</a></div>
    </div>

<script>
let regionCodes = {
    "+254": {name: "KENYA", seed: 254},
    "+255": {name: "TANZANIA", seed: 255},
    "+256": {name: "UGANDA", seed: 256},
    "+250": {name: "RWANDA", seed: 250}
};

function genCaptcha(){
    let code = document.getElementById('countryCode').value;
    let seed = regionCodes[code].seed;
    let random = Math.floor(Math.random() * 9000) + 1000;
    let finalCode = String((random + seed) % 10000).padStart(4,'0');
    document.getElementById('captchaCode').innerText = finalCode;
    document.getElementById('regionTag').innerText = '- ' + regionCodes[code].name;
}

function checkBtn(){
    let btn = document.getElementById('regBtn');
    if(document.getElementById('agree').checked){
        btn.classList.add('active');
        btn.disabled = false;
    }else{
        btn.classList.remove('active');
        btn.disabled = true;
    }
}

function register(){
    let phone = document.getElementById('phone').value;
    let pass = document.getElementById('pass').value;
    let capInput = document.getElementById('captchaInput').value;
    let capCode = document.getElementById('captchaCode').innerText;
    
    if(!phone ||!pass){alert('Please fill all fields'); return;}
    if(capInput!= capCode){alert('Wrong Verification Code'); genCaptcha(); return;}
    
    let fullPhone = document.getElementById('countryCode').value + phone;
    localStorage.setItem('userPhone', fullPhone);
    alert('Account Created for ' + fullPhone);
    window.location.href = '/index.html';
}

genCaptcha(); checkBtn();
</script>
</body>
</html>
