<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA REGISTER</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbbf24">
<link rel="apple-touch-icon" href="nexa_view_icon.webp">
<style>
body{background:#000;color:white;font-family:Poppins;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.box{background:#111;padding:30px;border-radius:16px;border:1px solid #fbbf24;width:90%;max-width:400px;text-align:center}
.logo{width:80px;height:80px;margin:0 auto 15px auto;display:block;border-radius:50%}
input,button,select{width:100%;padding:14px;margin:8px 0;background:#222;border:1px solid #333;color:white;border-radius:10px;font-size:15px;box-sizing:border-box}
button{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:black;font-weight:bold;cursor:pointer}
h2{color:#fbbf24;text-align:center;margin:0 0 10px 0}
a{color:#fbbf24}
.input-wrap{position:relative;width:100%}
.input-wrap input{padding-right:45px}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px}
.phone-row{display:flex;gap:8px;margin:8px 0}
.phone-row select{flex:0 0 130px;background:#222;border:1px solid #333;color:white;border-radius:10px;padding:14px;font-size:14px}
.phone-row input{flex:1}
.terms{display:flex;gap:8px;align-items:flex-start;margin:10px 0 2px 0;font-size:12px;color:#aaa;text-align:left}
.terms input{width:16px;height:16px;margin:2px 0 0 0;flex:0 0 16px}
.ref-valid{font-size:11px;color:#22c55e;margin:-4px 0 8px 0;text-align:left;display:none}
.ref-invalid{font-size:11px;color:#ef4444;margin:-4px 0 8px 0;text-align:left;display:none}
#toastBox{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;width:90%;max-width:350px}
.toast{background:#111;border:1.5px solid #22c55e;color:white;padding:14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.9);font-size:13px;text-align:center}
.toast.error{border-color:#ef4444}
</style>
</head>
<body>
<div id="toastBox"></div>
<div class="box">
  <img src="nexa_view_icon.webp" alt="NEXA VIEW" class="logo">
  <h2>NEXA REGISTER</h2>
  <input type="text" id="name" placeholder="Full Name">

  <div class="phone-row">
    <select id="countryCode">
      <option value="254">🇰🇪 KE +254</option>
      <option value="256">🇺🇬 UG +256</option>
      <option value="255">🇹🇿 TZ +255</option>
    </select>
    <input type="tel" id="phone" placeholder="712345678 or 0712345678">
  </div>

  <div class="input-wrap">
    <input type="password" id="pass" placeholder="Password">
    <span class="eye" onclick="toggleEye('pass',this)">👁️</span>
  </div>
  <div class="input-wrap">
    <input type="password" id="cpass" placeholder="Confirm Password">
    <span class="eye" onclick="toggleEye('cpass',this)">👁️</span>
  </div>
  <input type="text" id="refCode" placeholder="Referral Code (Optional)">
  <div id="refValid" class="ref-valid">✅ Valid referral code</div>
  <div id="refInvalid" class="ref-invalid">❌ Invalid referral code</div>

  <div class="terms">
    <input type="checkbox" id="termsCheck">
    <label for="termsCheck">I agree to <a href="#" onclick="alert('Terms: Daily profits, Fair use, Withdraw 24h')">Terms & Conditions</a> and Privacy Policy</label>
  </div>

  <button onclick="register()">REGISTER</button>
  <p style="text-align:center">Have account? <a href="index.html">Login here</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function showToast(msg,type="error"){
  const box=document.getElementById('toastBox');
  const t=document.createElement('div');
  t.className='toast '+(type=='error'?'error':'');
  t.innerText=msg;
  box.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}
function toggleEye(id,el){
  const inp=document.getElementById(id);
  if(inp.type==='password'){inp.type='text';el.innerText='🙈';}
  else{inp.type='password';el.innerText='👁️';}
}

// 07 and 7 SAME + Country selector
function formatPhone(rawPhone, countryPrefix){
  let p=rawPhone.replace(/\D/g,''); // remove non digits
  // remove existing country codes 254/256/255 if user typed full
  if(p.startsWith('254')||p.startsWith('256')||p.startsWith('255')){
    p=p.substring(3);
  }
  if(p.startsWith('0')) p=p.substring(1); // 0712 -> 712
  // Now p = 712... -> add selected country
  return countryPrefix + p; // e.g 254712...
}

// Get ref from URL?ref=XXXX
window.onload=function(){
  const urlParams=new URLSearchParams(window.location.search);
  const ref=urlParams.get('ref');
  if(ref){document.getElementById('refCode').value=ref;checkRef(ref);}
  // Save pending ref for dashboard
  if(ref) localStorage.setItem('pendingRef',ref);
}
function checkRef(code){
  if(!code){document.getElementById('refValid').style.display='none';document.getElementById('refInvalid').style.display='none';return;}
  db.collection("users").where("userId","==",code).get().then(snap=>{
    if(!snap.empty){document.getElementById('refValid').style.display='block';document.getElementById('refInvalid').style.display='none';}
    else{db.collection("users").where("myReferralCode","==",code).get().then(s2=>{
      if(!s2.empty){document.getElementById('refValid').style.display='block';document.getElementById('refInvalid').style.display='none';}
      else{document.getElementById('refValid').style.display='none';document.getElementById('refInvalid').style.display='block';}
    });}
  });
}
document.getElementById('refCode').addEventListener('input',function(){checkRef(this.value.trim());});

function register(){
  let name=document.getElementById('name').value.trim();
  let phoneRaw=document.getElementById('phone').value.trim();
  let countryPrefix=document.getElementById('countryCode').value; // 254/256/255
  let phone=formatPhone(phoneRaw, countryPrefix); // 07 and 7 = SAME!
  let pass=document.getElementById('pass').value.trim();
  let cpass=document.getElementById('cpass').value.trim();
  let refCode=document.getElementById('refCode').value.trim();
  let terms=document.getElementById('termsCheck').checked;

  if(!name||!phoneRaw||!pass||!cpass){showToast('Fill all fields');return;}
  if(!terms){showToast('Accept Terms & Conditions');return;}
  if(pass!==cpass){showToast('Passwords do not match');return;}
  if(pass.length<4){showToast('Password too short');return;}

  db.collection("users").doc(phone).get().then(doc=>{
    if(doc.exists){showToast('Phone already registered - 07 and 7 are same: '+phone);return;}

    let userId="NEXA"+phone.slice(-6);
    let myReferralCode=userId;

    let newUser={
      name:name,phone:phone,phoneDisplay:"0"+phone.substring(3),country:countryPrefix,
      password:pass,userId:userId,myReferralCode:myReferralCode,
      balance:0,totalProfit:0,totalReferralEarned:0,totalIncome:0,
      referrals:[],myReferralsLV1:[],myReferralsLV2:[],
      referredBy: refCode||null,
      hasPurchased:false,isActive:false,
      ownedPackages:{},ownedPackagesList:[],packageCounts:{},
      accNumber:"",accPin:"",date:firebase.firestore.FieldValue.serverTimestamp()
    };

    db.collection("users").doc(phone).set(newUser).then(()=>{
      if(refCode){
        db.collection("users").where("userId","==",refCode).get().then(snap=>{
          if(snap.empty){
            db.collection("users").where("myReferralCode","==",refCode).get().then(s2=>{
              if(!s2.empty){linkReferral(s2.docs[0].id, s2.docs[0].data(), phone, userId);}
              else{finishReg(phone);}
            });
          } else {
            linkReferral(snap.docs[0].id, snap.docs[0].data(), phone, userId);
          }
        });
      } else {
        finishReg(phone);
      }
    });
  });
}

function linkReferral(uplinePhone, uplineData, newPhone, newUserId){
  db.collection("users").doc(uplinePhone).update({
    referrals: firebase.firestore.FieldValue.arrayUnion(newPhone),
    myReferralsLV1: firebase.firestore.FieldValue.arrayUnion(newPhone)
  });
  if(uplineData.referredBy){
    db.collection("users").where("userId","==",uplineData.referredBy).get().then(s3=>{
      s3.forEach(gDoc=>{
        db.collection("users").doc(gDoc.id).update({
          myReferralsLV2: firebase.firestore.FieldValue.arrayUnion(newPhone)
        });
      });
      finishReg(newPhone);
    });
  } else {
    finishReg(newPhone);
  }
}

function finishReg(phone){
  showToast('Registration success!','success');
  localStorage.setItem("nexaPhone",phone);
  setTimeout(()=>{window.location.href="dashboard.html";},800);
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
</script>
</body>
</html>
