<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA REGISTER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Poppins;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.box{background:#111;padding:24px;border-radius:18px;border:1px solid #222;width:100%;max-width:380px} /* MADE NARROW */
h2{color:#fbbf24;text-align:center;font-size:24px;margin:0 0 20px 0;font-weight:700}
label{font-size:12px;color:#aaa;margin-bottom:6px;display:block;font-weight:600;letter-spacing:0.5px}
input,select{width:100%;padding:13px;background:#1a1a1a;border:1px solid #333;color:white;border-radius:10px;font-size:14px;margin-bottom:14px}
.phone-wrap{display:flex;gap:8px}
.phone-wrap select{width:28%;padding:13px 5px}
.phone-wrap input{width:72%;margin-bottom:0}
button{width:100%;padding:15px;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:black;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.checkbox{display:flex;align-items:center;gap:8px;margin:12px 0 0 0;font-size:12px}
.checkbox input{width:16px;height:16px;margin:0;accent-color:#fbbf24}
.checkbox a{color:#fbbf24;text-decoration:none}
a{color:#fbbf24;text-decoration:none}
.code-box{display:flex;gap:8px}
.code-box input{flex:1;margin-bottom:0}
.code-display{background:#1a1a1a;border:1px solid #fbbf24;color:#fbbf24;font-weight:700;font-size:16px;letter-spacing:2px;text-align:center;padding:13px;border-radius:10px;min-width:90px;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <h2>Create Account</h2>
  
  <label>USERNAME</label>
  <input type="text" id="username" placeholder="Choose any nickname e.g King254">

  <label>PHONE NUMBER</label>
  <div class="phone-wrap">
    <select id="countryCode">
      <option>+254</option>
    </select>
    <input type="tel" id="phone" placeholder="712345678">
  </div>

  <label>PASSWORD</label>
  <input type="password" id="pass" placeholder="Enter password">

  <label>REFERRAL CODE - OPTIONAL</label>
  <input type="text" id="refCode" placeholder="Enter code if you have one">

  <label>VERIFICATION CODE - KENYA</label>
  <div class="code-box">
    <input type="text" id="captchaInput" placeholder="Enter code">
    <div class="code-display" id="captchaCode" onclick="newCaptcha()">8259</div>
  </div>

  <div class="checkbox">
    <input type="checkbox" id="terms">
    <span>I agree to <a href="#" onclick="alert('By registering you agree to NEXA Terms and Conditions')">Terms</a></span>
  </div>

  <button onclick="register()">REGISTER</button>
  
  <p style="text-align:center;margin-top:16px;font-size:13px">Have account? <a href="index.html">Login</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 1. AUTO FILL REFERRAL CODE FROM LINK ?ref=NEXA7A9B2
const urlParams = new URLSearchParams(window.location.search);
const refFromUrl = urlParams.get('ref');
if(refFromUrl){ document.getElementById('refCode').value = refFromUrl; }

// 2. CAPTCHA
function newCaptcha(){
  document.getElementById('captchaCode').innerText = Math.floor(1000 + Math.random() * 9000);
}
newCaptcha();

function formatPhone(p){
  p = p.replace(/\D/g,'');
  if(p.startsWith('0')) return '254' + p.substring(1);
  return '254' + p;
}

// 3. GENERATE UNIQUE USER ID: NEXAU + 6 chars
function generateUserID(){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let id = 'NEXAU';
  for(let i=0; i<6; i++){ id += chars.charAt(Math.floor(Math.random() * chars.length)); }
  return id;
}

// 4. GENERATE REFERRAL CODE: NEXAR + 5 chars - DIFFERENT FROM USERID
function generateRefCode(){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let code = 'NEXAR';
  for(let i=0; i<5; i++){ code += chars.charAt(Math.floor(Math.random() * chars.length)); }
  return code;
}

function register(){
  let username = document.getElementById('username').value.trim();
  let phone = formatPhone(document.getElementById('phone').value.trim());
  let pass = document.getElementById('pass').value.trim();
  let refBy = document.getElementById('refCode').value.trim();
  let captcha = document.getElementById('captchaInput').value.trim();
  let realCaptcha = document.getElementById('captchaCode').innerText;
  
  if(!username || !phone || !pass){ alert('❌ Fill Username, Phone and Password'); return; }
  if(captcha !== realCaptcha){ alert('❌ Wrong Verification Code'); newCaptcha(); return; }
  if(!document.getElementById('terms').checked){ alert('❌ Please agree to Terms'); return; }
  
  let userID = generateUserID(); // For Wallet: NEXAU7A9B2C
  let myRefCode = generateRefCode(); // For Sharing: NEXAR7A9B2
  
  db.collection("users").doc(phone).get().then(doc=>{
    if(doc.exists){ alert('❌ Phone number already registered'); return; }
    
    db.collection("users").doc(phone).set({
      phone, username, realName: username,
      userID: userID, // UNIQUE ID FOR WALLET/PROFILE
      password:pass, balance:0, ownedPackages:{}, tasksDone:0, referralBonus:0,
      myReferralCode: myRefCode, // DIFFERENT CODE FOR REFERRALS
      referredBy: refBy || '', 
      createdAt:new Date()
    }).then(()=>{
      alert(`✅ Account Created!\n\nUsername: ${username}\nUser ID: ${userID}\nYour Referral Code: ${myRefCode}`);
      localStorage.setItem("nexaPhone", phone);
      window.location.href = "dashboard.html";
    });
  });
}
</script>
</body>
</html>
