<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA TASKS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Poppins;margin:0;padding:15px 15px 80px 15px}

.box{background:#111;padding:18px;border-radius:16px;margin:15px 0;border:1px solid #222}
h3{color:white;margin:0 0 12px 0;font-size:16px;font-weight:700}

.btn{padding:12px;background:linear-gradient(180deg,#22c55e,#16a34a);color:white;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.btn:disabled{background:#444;color:#888;cursor:not-allowed}

.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.nav-item{flex:1;text-align:center;font-size:10px;color:#888;cursor:pointer;text-decoration:none}
.nav-item.active{color:#fbbf24;font-weight:700}
.nav-item svg{width:20px;height:20px;margin-bottom:3px}
</style>
</head>
<body>

<h2>✅ DAILY TASKS</h2>
<p style="color:#aaa;margin-bottom:15px">Complete tasks to earn daily profit</p>

<div class="box">
  <div id="taskList"><p style="color:#888">Loading...</p></div>
</div>

<button class="btn" onclick="window.location.href='dashboard.html'" style="width:100%;background:#333;margin-top:10px">← BACK TO DASHBOARD</button>

<div class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>Home</a>
  <a href="tasks.html" class="nav-item active"><svg fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path d="M4 5a2 2 0 012-2h8a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h6a1 1 0 100-2H7z"/></svg>Tasks</a>
  <a href="wallet.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 0 01-2-2v-4z"/></svg>Wallet</a>
  <a href="referrals.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 20 20"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Team</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const phone = localStorage.getItem("nexaPhone");
if(!phone){ window.location.href = "index.html"; }

const foodPics = [
  "https://images.unsplash.com/photo-1608198093002-ad4e005484ec?w=400",
  "https://images.unsplash.com/photo-1618164439484-1e3e29e3d6b5?w=400",
  "https://images.unsplash.com/photo-1542838132-92c53300491e?w=400",
  "https://images.unsplash.com/photo-1597362925123-77861d3fbac7?w=400",
  "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400"
];

function loadTasks(){
  db.collection("users").doc(phone).get().then(doc=>{
    if(doc.exists){
      let u = doc.data();
      let owned = u.ownedPackages || {};
      let html = "";
      let keys = Object.keys(owned);
      if(keys.length == 0){
        html = "<p style='color:#888'>No active package. Buy one from Home page.</p>";
      } else {
        keys.forEach(key=>{
          let p = owned[key];
          let today = new Date().toDateString();
          let lastClaim = u.lastClaim || {};
          let canClaim = lastClaim[key]!= today;
          let dayIndex = new Date().getDate() % foodPics.length;
          let pic = foodPics[dayIndex];
          let statusText = canClaim? "Sell your Product & Earn" : "Already Sold Today";
          let statusColor = canClaim? "#22c55e" : "#ef4444";
          let btnColor = canClaim? "linear-gradient(180deg,#22c55e,#16a34a)" : "#444";
          let btnText = canClaim? "SELL" : "SOLD";
          html += `<div style="background:#111;padding:16px;border-radius:14px;margin-bottom:15px;border:1px solid #333">
            <div style="background:${statusColor};color:#000;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700;text-align:center;margin-bottom:10px">${statusText}</div>
            <h3 style="margin:0 0 10px 0;color:#22c55e">Package - Ksh ${p.price}</h3>
            <img src="${pic}" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:12px;border:1px solid #333">
            <div style="display:flex;gap:10px;margin-bottom:12px">
              <button onclick="claimTask('${key}')" style="flex:1;padding:12px;background:${btnColor};color:white;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer" ${canClaim?'':'disabled'}>${btnText}</button>
              <div style="flex:1;background:#1a3d2a;border:1px solid #22c55e;border-radius:10px;padding:10px;text-align:center">
                <div style="font-size:10px;color:#aaa">DAILY PROFIT</div>
                <b style="color:#22c55e;font-size:16px">Ksh ${p.daily}</b>
              </div>
            </div>
            <p style="font-size:11px;color:#aaa;margin:0">Tap <b>SELL</b> every day. Color changes: <span style="color:#ef4444">Red →</span> <span style="color:#22c55e">Green</span> after you sell.</p>
          </div>`;
        });
      }
      document.getElementById('taskList').innerHTML = html;
    }
  })
}

function claimTask(key){
  let today = new Date().toDateString();
  db.collection("users").doc(phone).get().then(doc=>{
    let u = doc.data();
    let p = u.ownedPackages[key];
    let newBalance = (u.balance || 0) + p.daily;
    let newTotal = (u.totalIncome || 0) + p.daily;
    let lastClaim = u.lastClaim || {};
    lastClaim[key] = today;
    db.collection("users").doc(phone).update({balance:newBalance,totalIncome:newTotal,lastClaim:lastClaim}).then(()=>{
      alert("Earned Ksh "+p.daily);
      loadTasks();
    })
  })
}

window.onload = loadTasks;
</script>
</body>
</html>
