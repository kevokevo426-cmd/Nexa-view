<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA TASKS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Poppins;margin:0;padding:15px 15px 80px 15px}

.box{background:#111;padding:18px;border-radius:16px;margin:15px 0;border:1px solid #222}
h3{color:white;margin:0 0 12px 0;font-size:16px;font-weight:700}
.product-img{width:100%;height:140px;object-fit:cover;border-radius:12px;margin-bottom:12px;border:1px solid #333;background:#1a1a1a}

.btn{flex:1;padding:12px;background:linear-gradient(180deg,#22c55e,#16a34a);color:white;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.btn:disabled{background:#444;color:#888;cursor:not-allowed}

.profit-box{flex:1;background:#1a3d2a;border:1px solid #22c55e;border-radius:10px;padding:10px;text-align:center;display:none}
.profit-box.show{display:block;animation:pop 0.4s ease}
@keyframes pop{0%{transform:scale(0.8)}100%{transform:scale(1)}}

/* LOADING BAR */
.loading-bar{display:none;width:100%;height:6px;background:#222;border-radius:10px;margin-bottom:12px;overflow:hidden}
.loading-fill{height:100%;width:0;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:10px;transition:width 0.3s}
.loading-text{text-align:center;font-size:11px;color:#fbbf24;margin-bottom:8px;display:none}

.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.nav-item{flex:1;text-align:center;font-size:10px;color:#888;cursor:pointer;text-decoration:none}
.nav-item.active{color:#fbbf24;font-weight:700}
</style>
</head>
<body>

<h2>✅ DAILY TASKS</h2>
<p style="color:#aaa;margin-bottom:15px">Complete tasks to earn daily profit</p>

<div class="box">
  <div id="taskList"><p style="color:#888">Loading...</p></div>
</div>

<button class="btn" onclick="window.location.href='dashboard.html'" style="width:100%;background:#333;margin-top:10px">← BACK TO DASHBOARD</button>

<div class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 20 20" width="20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>Home</a>
  <a href="tasks.html" class="nav-item active"><svg fill="currentColor" viewBox="0 0 20 20" width="20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/></svg>Tasks</a>
  <a href="wallet.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 20 20" width="20"><path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4z"/></svg>Wallet</a>
  <a href="referrals.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 20 20" width="20"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Team</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const phone = localStorage.getItem("nexaPhone");
if(!phone){ window.location.href = "index.html"; }

// Product images based on package type. Auto changes daily at 0000hrs
const productImages = {
  "Service": ["https://images.unsplash.com/photo-1556740738-b6a63e27c4df?w=400","https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=400"],
  "Food Stuffs": ["https://images.unsplash.com/photo-1542838132-92c53300491e?w=400","https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400"],
  "By products": ["https://images.unsplash.com/photo-1608198093002-ad4e005484ec?w=400","https://images.unsplash.com/photo-1618164439484-1e3e29e3d6b5?w=400"],
  "House Hold": ["https://images.unsplash.com/photo-1554995207-c18c203602cb?w=400","https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400"],
  "Beauty": ["https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?w=400","https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400"],
  "Stationaries": ["https://images.unsplash.com/photo-1456735190827-d1262f71b8a3?w=400","https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400"],
  "Sporting": ["https://images.unsplash.com/photo-1571019613454-1cb2f99cf2be?w=400","https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=400"],
  "Appliances": ["https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400","https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=400"]
};

function getProductImage(productName){
  let day = new Date().getDate(); // changes at 0000hrs
  let images = productImages[productName] || productImages["Service"];
  return images[day % images.length];
}

function loadTasks(){
  db.collection("users").doc(phone).get().then(doc=>{
    if(doc.exists){
      let u = doc.data();
      let owned = u.ownedPackages || {};
      let html = "";
      let keys = Object.keys(owned);
      if(keys.length == 0){
        html = "<p style='color:#888'>No active package. Buy one from Home page.</p>";
      } else {
        keys.forEach(key=>{
          let p = owned[key];
          let productName = getProductNameByPrice(p.price);
          let today = new Date().toDateString();
          let lastClaim = u.lastClaim || {};
          let canClaim = lastClaim[key]!= today;
          let pic = getProductImage(productName);
          let statusText = canClaim? "Sell your Product & Earn" : "Already Sold Today";
          let statusColor = canClaim? "#22c55e" : "#ef4444";
          let btnColor = canClaim? "linear-gradient(180deg,#22c55e,#16a34a)" : "#444";
          let btnText = canClaim? "SELL" : "SOLD";
          
          html += `<div style="background:#111;padding:16px;border-radius:14px;margin-bottom:15px;border:1px solid #333">
            <div style="background:${statusColor};color:#000;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700;text-align:center;margin-bottom:10px">${statusText}</div>
            <h3 style="margin:0 0 10px 0;color:#22c55e">${productName}</h3>
            <img src="${pic}" class="product-img">
            
            <div id="loading-${key}" class="loading-text">Processing...</div>
            <div id="loadingBar-${key}" class="loading-bar"><div id="fill-${key}" class="loading-fill"></div></div>

            <div style="display:flex;gap:10px;margin-bottom:12px">
              <button id="btn-${key}" onclick="claimTask('${key}', '${productName}', ${p.daily})" style="flex:1;padding:12px;background:${btnColor};color:white;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer" ${canClaim?'':'disabled'}>${btnText}</button>
              <div id="profit-${key}" class="profit-box">
                <div style="font-size:10px;color:#aaa">PROFIT</div>
                <b style="color:#22c55e;font-size:16px">Ksh ${p.daily}</b>
              </div>
            </div>
            <p style="font-size:11px;color:#aaa;margin:0">Tap <b>SELL</b> every day. Image updates at 12:00AM</p>
          </div>`;
        });
      }
      document.getElementById('taskList').innerHTML = html;
    }
  })
}

function getProductNameByPrice(price){
  if(price==300) return "Service";
  if(price==700) return "Food Stuffs";
  if(price==1300) return "By products";
  if(price==2500) return "House Hold";
  if(price==3500) return "Beauty";
  if(price==4800) return "Stationaries";
  if(price==7500) return "Sporting";
  if(price==10000) return "Appliances";
  return "Service";
}

function claimTask(key, productName, daily){
  let btn = document.getElementById('btn-'+key);
  let loadingBar = document.getElementById('loadingBar-'+key);
  let loadingText = document.getElementById('loading-'+key);
  let fill = document.getElementById('fill-'+key);
  let profitBox = document.getElementById('profit-'+key);
  
  btn.disabled = true;
  loadingBar.style.display = 'block';
  loadingText.style.display = 'block';
  let progress = 0;
  
  let interval = setInterval(()=>{
    progress += 33;
    fill.style.width = progress + '%';
    if(progress <= 33) loadingText.innerText = "Processing...";
    if(progress <= 66 && progress > 33) loadingText.innerText = "Selling...";
    if(progress > 66) loadingText.innerText = "Sold!";
    
    if(progress >= 100){
      clearInterval(interval);
      setTimeout(()=>{
        loadingBar.style.display = 'none';
        loadingText.style.display = 'none';
        profitBox.classList.add('show');
        saveProfit(key, daily);
      }, 300)
    }
  }, 400)
}

function saveProfit(key, daily){
  let today = new Date().toDateString();
  db.collection("users").doc(phone).get().then(doc=>{
    let u = doc.data();
    let newBalance = (u.balance || 0) + daily;
    let newTotal = (u.totalIncome || 0) + daily;
    let lastClaim = u.lastClaim || {};
    lastClaim[key] = today;
    db.collection("users").doc(phone).update({balance:newBalance,totalIncome:newTotal,lastClaim:lastClaim})
  })
}

window.onload = loadTasks;
</script>
</body>
</html>
