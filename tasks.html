<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA TASKS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{background:#000;color:white;font-family:Poppins;margin:0;padding:15px 15px 90px 15px}
.box{background:#111;padding:18px;border-radius:16px;margin:15px 0;border:1px solid #222}
h3{color:white;margin:0 0 12px 0;font-size:16px;font-weight:700}
.product-img{width:100%;height:140px;object-fit:cover;border-radius:12px;margin-bottom:12px;border:1px solid #333;background:#0a0a0a;display:block}
.btn{flex:1;padding:14px;background:#22c55e;color:white;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer}
.btn:disabled{background:#444;color:#888;cursor:not-allowed}
.profit-box{flex:1;background:#052e16;border:1.5px solid #22c55e;border-radius:12px;padding:12px;text-align:center;display:none}
.profit-box.show{display:block;animation:pop 0.5s ease}
@keyframes pop{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
/* THICKER SCAN BAR ON TOP */
.scan-wrap{width:100%;margin-bottom:14px;display:none}
.scan-label{text-align:center;font-size:12px;color:#fbbf24;font-weight:700;margin-bottom:6px;letter-spacing:1px}
.scan-bar{width:100%;height:12px;background:#222;border-radius:20px;overflow:hidden;border:1px solid #333;position:relative}
.scan-fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#fbbf24,#22c55e);border-radius:20px;transition:width 0.3s ease;position:relative}
.scan-fill::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);animation:shine 1.2s infinite}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0 15px 0;z-index:99}
.nav-item{flex:1;text-align:center;font-size:11px;color:#666;cursor:pointer;text-decoration:none;transition:0.3s}
.nav-item svg{width:24px;height:24px;margin-bottom:4px;display:block;margin:0 auto 4px auto;transition:0.3s}
.nav-item.active{transform:translateY(-3px) scale(1.1);font-weight:800}
.nav-item.active:nth-child(1){color:#fbbf24}
.nav-item.active:nth-child(1) svg{filter:drop-shadow(0 0 10px #fbbf24);fill:#fbbf24}
.nav-item:nth-child(2).active{color:#22c55e}
.nav-item:nth-child(2).active svg{filter:drop-shadow(0 0 10px #22c55e);fill:#22c55e}
.nav-item:nth-child(3).active{color:#3b82f6}
.nav-item:nth-child(3).active svg{filter:drop-shadow(0 0 10px #3b82f6);fill:#3b82f6}
.nav-item:nth-child(4).active{color:#f97316}
.nav-item:nth-child(4).active svg{filter:drop-shadow(0 0 10px #f97316);fill:#f97316}
#toastBox{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;width:90%;max-width:350px}
.toast{background:#111;border:1.5px solid #22c55e;color:white;padding:14px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,0.9);font-size:13px;text-align:center;font-weight:600}
</style>
</head>
<body>
<div id="toastBox"></div>
<h2>✅ DAILY TASKS</h2>
<p style="color:#aaa;margin-bottom:15px">Complete tasks to earn daily profit</p>

<div class="box">
  <div id="taskList"><p style="color:#888">Loading...</p></div>
</div>

<button class="btn" onclick="window.location.href='dashboard.html'" style="width:100%;background:#333;margin-top:10px">← BACK TO DASHBOARD</button>

<div class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
  <a href="tasks.html" class="nav-item active"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>Tasks</a>
  <a href="wallet.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2.9 2 2v1h-9c-1.11 0-2.9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>Wallet</a>
  <a href="referrals.html" class="nav-item"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Team</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const phone = localStorage.getItem("nexaPhone");
if(!phone){ window.location.href = "index.html"; }

function showToast(msg){
  const box=document.getElementById('toastBox');
  const t=document.createElement('div');
  t.className='toast';
  t.innerText=msg;
  box.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},3500);
}

const productImages = {
  "Service": ["https://images.unsplash.com/photo-1556740738-b6a63e27c4df?w=400","https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=400"],
  "Food Stuffs": ["https://images.unsplash.com/photo-1542838132-92c53300491e?w=400","https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400"],
  "By products": ["https://images.unsplash.com/photo-1608198093002-ad4e005484ec?w=400"],
  "House Hold": ["https://images.unsplash.com/photo-1554995207-c18c203602cb?w=400"],
  "Beauty": ["https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?w=400"],
  "Stationaries": ["https://images.unsplash.com/photo-1456735190827-d1262f71b8a3?w=400"],
  "Sporting": ["https://images.unsplash.com/photo-1571019613454-1cb2f99cf2be?w=400"],
  "Appliances": ["https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400"]
};

function getProductImage(name){
  let day=new Date().getDate();
  let imgs=productImages[name]||productImages["Service"];
  return imgs[day % imgs.length];
}
function getProductNameByPrice(price){
  if(price==300) return "Service";
  if(price==700) return "Food Stuffs";
  if(price==1300) return "By products";
  if(price==2500) return "House Hold";
  if(price==3500) return "Beauty";
  if(price==4800) return "Stationaries";
  if(price==7500) return "Sporting";
  if(price==10000) return "Appliances";
  return "Service";
}

function loadTasks(){
  db.collection("users").doc(phone).get().then(doc=>{
    if(!doc.exists) return;
    let u=doc.data();
    let ownedList = u.ownedPackagesList || [];
    let owned = u.ownedPackages || {};
    let html="";
    let tasksToShow = ownedList.length>0? ownedList.map((p,i)=>({...p,key:p.name+"_"+i,idx:i})) : Object.keys(owned).map(k=>({...owned[k],key:k,name:k,idx:0}));

    if(tasksToShow.length==0){
      html="<p style='color:#888'>No active package. Buy one from Home page.</p>";
    } else {
      tasksToShow.forEach(item=>{
        let productName=getProductNameByPrice(item.price);
        let today=new Date().toDateString();
        let lastClaim=u.lastClaim||{};
        let canClaim=lastClaim[item.key]!=today;
        let pic=getProductImage(productName);
        let statusColor=canClaim?"#ef4444":"#22c55e";
        let statusText=canClaim?"Ready to Sell":"Sold Today";
        html+=`<div style="background:#111;padding:16px;border-radius:14px;margin-bottom:15px;border:1px solid #333">
          <div style="background:${statusColor};color:${canClaim?'white':'#000'};padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;text-align:center;margin-bottom:10px">${statusText} - ${item.name} ${item.idx? '#'+(item.idx+1):''}</div>
          <h3 style="margin:0 0 10px 0;color:#22c55e">${productName} - Ksh ${item.price}</h3>
          <img src="${pic}" class="product-img" onerror="this.src='https://via.placeholder.com/400x200/111/22c55e?text=NEXA+${productName}'">

          <div id="scanWrap-${item.key}" class="scan-wrap">
            <div id="scanLabel-${item.key}" class="scan-label">Processing...</div>
            <div class="scan-bar"><div id="scanFill-${item.key}" class="scan-fill"></div></div>
          </div>

          <div style="display:flex;gap:10px;margin-bottom:10px">
            <button id="btn-${item.key}" onclick="startSell('${item.key}', ${item.daily})" style="flex:1;padding:14px;background:${canClaim?'#22c55e':'#444'};color:white;border:none;border-radius:12px;font-weight:800;font-size:15px" ${canClaim?'':'disabled'}>${canClaim?'SELL':'SOLD'}</button>
            <div id="profit-${item.key}" class="profit-box">
              <div style="font-size:10px;color:#aaa">PROFIT</div>
              <b style="color:#22c55e;font-size:16px">Ksh ${item.daily}</b>
            </div>
          </div>
          <p style="font-size:12px;color:#aaa;margin:0">Tap <b style="color:white">SELL</b> every day.<br>Color changes: <span style="color:#ef4444">Red</span> → <span style="color:#22c55e">Green</span> after you sell.</p>
        </div>`;
      });
    }
    document.getElementById('taskList').innerHTML=html;
  });
}

function startSell(key, daily){
  let btn=document.getElementById('btn-'+key);
  let wrap=document.getElementById('scanWrap-'+key);
  let label=document.getElementById('scanLabel-'+key);
  let fill=document.getElementById('scanFill-'+key);
  let profitBox=document.getElementById('profit-'+key);

  btn.disabled=true;
  wrap.style.display='block';
  profitBox.style.display='none';
  profitBox.classList.remove('show');

  let progress=0;
  label.innerText="Processing...";
  fill.style.width="0%";

  let interval=setInterval(()=>{
    progress+=2; // SLOW scan - left to right
    if(progress>100) progress=100;
    fill.style.width=progress+"%";

    if(progress<30) label.innerText="Processing...";
    else if(progress<70) label.innerText="Selling...";
    else if(progress<100) label.innerText="Sold!";
    else label.innerText="Completed!";

    if(progress>=100){
      clearInterval(interval);
      setTimeout(()=>{
        wrap.style.display='none';
        profitBox.style.display='block';
        profitBox.classList.add('show');
        saveProfit(key, daily);
      },400);
    }
  },80); // slow speed - total ~4 seconds
}

function saveProfit(key, daily){
  let today=new Date().toDateString();
  db.collection("users").doc(phone).get().then(doc=>{
    let u=doc.data();
    let newBalance=(u.balance||0)+daily;
    let lastClaim=u.lastClaim||{};
    lastClaim[key]=today;
    db.collection("users").doc(phone).update({balance:newBalance,totalIncome:(u.totalIncome||0)+daily,lastClaim:lastClaim,lastIncomeUpdate:new Date().toISOString().split('T')[0]}).then(()=>{
      showToast("Ksh "+daily+" profit added!");
      loadTasks();
    });
  });
}

window.onload=loadTasks;
</script>
</body>
</html>
