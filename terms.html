<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms - NEXA VIEW</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{
  background:#000;
  color:white;
  font-family:Poppins;
  padding:20px;
  line-height:1.8;
  max-width:800px;
  margin:auto
}
h1{
  color:#fbbf24;
  text-align:center;
  margin-bottom:10px
}
.last-updated{
  text-align:center;
  color:#aaa;
  font-size:13px;
  margin-bottom:30px
}
#termsContent{
  background:#111;
  padding:20px;
  border-radius:12px;
  border:1px solid #222;
  font-size:14px;
  white-space:pre-line
}
.back-btn{
  display:block;
  width:100%;
  text-align:center;
  background:#fbbf24;
  color:#000;
  padding:14px;
  border-radius:10px;
  text-decoration:none;
  font-weight:800;
  margin-top:30px
}
.back-btn:active{transform:scale(0.97)}
.loader{
  text-align:center;
  color:#aaa;
  padding:40px
}
</style>
</head>
<body>

<h1>📜 NEXA VIEW - Terms & Conditions</h1>
<p class="last-updated">Last Updated: <span id="lastUpdated">Loading...</span></p>

<div id="termsContent" class="loader">Loading Terms...</div>

<a href="register.html" class="back-btn">← Back to Register</a>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",
  authDomain:"nexa-view.firebaseapp.com",
  projectId:"nexa-view"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// LOAD TERMS FROM FIREBASE
db.collection("settings").doc("terms").get().then(doc=>{
  if(doc.exists){
    let data = doc.data();
    document.getElementById('termsContent').innerText = data.content;
    
    if(data.updated){
      let date = data.updated.toDate().toLocaleDateString('en-KE', {year:'numeric', month:'long', day:'numeric'});
      document.getElementById('lastUpdated').innerText = date;
    } else {
      document.getElementById('lastUpdated').innerText = "August 21, 2026";
    }
  } else {
    document.getElementById('termsContent').innerText = "Terms not set. Please add them in Firebase > settings > terms > content";
    document.getElementById('lastUpdated').innerText = "Not Set";
  }
}).catch(err=>{
  document.getElementById('termsContent').innerText = "Error loading terms. Please check internet connection.";
  console.log(err);
})
</script>
</body>
</html>
