<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms - NEXA VIEW</title>
<style>body{background:#000;color:white;font-family:Poppins;padding:20px;line-height:1.7;max-width:700px;margin:auto}h1{color:#fbbf24}h2{color:#fbbf24;margin-top:30px}a{color:#fbbf24}</style>
</head>
<body>
<h1>NEXA VIEW - User Agreement</h1>
<p>Last Updated: <span id="lastUpdated">Loading...</span></p>

<div id="termsContent">Loading Terms...</div>

<p style="margin-top:40px;text-align:center"><a href="register.html">← Back to Register</a></p>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyD1ftJH909fbV9X5oUr8r5c9YkeV7N1ecI",authDomain:"nexa-view.firebaseapp.com",projectId:"nexa-view"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// LOAD TERMS FROM FIREBASE
db.collection("settings").doc("terms").get().then(doc=>{
  if(doc.exists){
    document.getElementById('termsContent').innerHTML = doc.data().content.replace(/\n/g, '<br>');
    let date = doc.data().updated.toDate().toLocaleDateString();
    document.getElementById('lastUpdated').innerText = date;
  }else{
    document.getElementById('termsContent').innerHTML = "Terms not set. Please contact admin.";
  }
})
</script>
</body>
</html>
